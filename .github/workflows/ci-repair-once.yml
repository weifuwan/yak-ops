name: Temporary Main CI Format Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-repair-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  format-and-dispatch:
    name: Format six files and dispatch comprehensive checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Format with repository pinned oxfmt
        working-directory: yak-ops-ui
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run format
          npm run format:check
      - name: Commit only formatter changes to main
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          allowed=$'yak-ops-ui/apps/web/app/data-sync/editor/field-mapping-canvas.tsx\nyak-ops-ui/apps/web/app/data-sync/editor/field-mapping-section.tsx\nyak-ops-ui/apps/web/app/data-sync/editor/manual-field-mapping-dialog.tsx\nyak-ops-ui/apps/web/app/data-sync/editor/use-field-mapping-drag.ts\nyak-ops-ui/apps/web/service/data-sync/transforms.ts\nyak-ops-ui/scripts/verify-data-sync-transforms.mjs'
          while IFS= read -r file; do
            grep -Fxq -- "$file" <<< "$allowed" || { echo "::error::Unexpected formatting change $file"; exit 1; }
          done < <(git diff --name-only)
          git add -- yak-ops-ui/apps/web/app/data-sync/editor/field-mapping-canvas.tsx yak-ops-ui/apps/web/app/data-sync/editor/field-mapping-section.tsx yak-ops-ui/apps/web/app/data-sync/editor/manual-field-mapping-dialog.tsx yak-ops-ui/apps/web/app/data-sync/editor/use-field-mapping-drag.ts yak-ops-ui/apps/web/service/data-sync/transforms.ts yak-ops-ui/scripts/verify-data-sync-transforms.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(ui): format field mapping and transform code'
            git push origin HEAD:main
          fi
      - name: Dispatch all non-release verification workflows on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run backend-tests.yml --ref main -f suite=full
          gh workflow run cdc-contract-tests.yml --ref main
          gh workflow run dev-compile.yml --ref main
          gh workflow run mysql-cdc-debezium-runtime.yml --ref main
          gh workflow run playwright-ui-tests.yml --ref main
          gh workflow run nightly-backend-acceptance.yml --ref main
          echo 'Dispatched backend, CDC, dev compile, MySQL, Playwright and nightly acceptance.'
