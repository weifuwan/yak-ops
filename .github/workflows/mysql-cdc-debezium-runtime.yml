name: MySQL CDC Debezium Runtime Verification

on:
  pull_request:
    paths:
      - 'yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-source-connectors/yak-ops-connector-mysql-cdc/**'
      - '.github/workflows/mysql-cdc-debezium-runtime.yml'
      - 'scripts/tests/backend_tests.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-contract:
    name: Compile and verify MySQL CDC contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compile/test phases avoid the unrelated baseline Spotless violations
      # currently blocking the repository-wide verify lifecycle.
      - name: Compile MySQL CDC and reactor dependencies
        run: bash mvnw -B -ntp -pl yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-source-connectors/yak-ops-connector-mysql-cdc -am -DskipTests compile
      - name: Install reactor dependencies without unrelated upstream test compilation
        run: >
          bash mvnw -B -ntp -pl yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-source-connectors/yak-ops-connector-mysql-cdc -am
          -Dmaven.test.skip=true -Dspotless.check.skip=true -Dcheckstyle.skip=true install
      - name: Verify all MySQL CDC unit tests
        run: bash mvnw -B -ntp -pl yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-source-connectors/yak-ops-connector-mysql-cdc test
