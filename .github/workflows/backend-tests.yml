name: Backend Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Database integration suite
        type: choice
        required: true
        default: full
        options: [full, business, cdc]

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unit_modules: ${{ steps.unit.outputs.unit_modules }}
      suites: ${{ steps.select.outputs.suites }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify test selector
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 scripts/tests/backend_tests.py registration
      - name: Select unit-test modules
        id: unit
        env:
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_CURRENT_SHA: ${{ github.sha }}
        run: python3 scripts/ci/ci_scope.py tests
      - name: Select database suites
        id: select
        env:
          REQUESTED_SUITE: ${{ inputs.suite || 'auto' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_CURRENT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/tests/backend_tests.py select "$REQUESTED_SUITE"

  unit-tests:
    name: Backend Unit Tests
    needs: scope
    if: needs.scope.outputs.unit_modules != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run JUnit tests including CDC modules
        env:
          TEST_MODULES: ${{ needs.scope.outputs.unit_modules }}
        run: |
          bash mvnw -B -ntp -pl "$TEST_MODULES" -am -Dspotless.check.skip=true -Dcheckstyle.skip=true test
      - name: Upload Surefire diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-failures
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 7

  integration-tests:
    name: Backend Integration Tests (${{ matrix.suite }})
    needs: scope
    if: needs.scope.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run isolated database integration tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: bash scripts/tests/run.sh "$TEST_SUITE"
      - name: Compile JDBC integration fixtures
        if: matrix.suite == 'cdc'
        run: |
          bash mvnw -B -ntp -pl yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-jdbc-parent/yak-ops-cdc-pipeline-connector-jdbc -am -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true install
      - name: Verify MySQL CDC to JDBC pipeline and sink integration
        if: matrix.suite == 'cdc'
        run: |
          bash mvnw -B -ntp -pl yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-jdbc-parent/yak-ops-cdc-pipeline-connector-jdbc -Dtest=JdbcSinkGenericITCase,MySqlDataSinkITCase,MySqlMetadataApplierITCase,MySqlPipelineToJdbcITCase -Dsurefire.failIfNoSpecifiedTests=false -Dspotless.check.skip=true -Dcheckstyle.skip=true test
          python3 scripts/tests/backend_tests.py jdbc-reports
      - name: Upload database test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.suite }}
          path: |
            **/target/failsafe-reports/**
            **/target/surefire-reports/**
            **/target/test-artifacts/**
          if-no-files-found: error
          retention-days: 7

  backend-tests-check:
    name: Backend Tests Check
    if: always()
    needs: [scope, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check unit-test result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          UNIT_MODULES: ${{ needs.scope.outputs.unit_modules }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ -n "$UNIT_MODULES" ]; then
            test "$UNIT_RESULT" = success
          else
            test "$UNIT_RESULT" = skipped
          fi
      - name: Require database test results
        env:
          SELECTED_SUITES: ${{ needs.scope.outputs.suites || '[]' }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          TESTS_RESULT: ${{ needs.integration-tests.result }}
        run: python3 scripts/tests/backend_tests.py check
