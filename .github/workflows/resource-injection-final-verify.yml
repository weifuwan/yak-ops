name: Resource Injection Final Verification

on:
  push:
    branches:
      - refactor/resource-injection-rule-final-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Resource injection rules
        shell: python
        run: |
          import re
          from pathlib import Path

          stereotypes = ("@Service", "@Repository", "@Component", "@RestController", "@RestControllerAdvice", "@Configuration")
          violations = []

          for path in Path(".").rglob("*.java"):
              if "yak-ops-ui" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              if not any(item in text for item in stereotypes):
                  continue

              if "@RequiredArgsConstructor" in text:
                  violations.append(f"{path}: @RequiredArgsConstructor")
              if "@Autowired" in text:
                  violations.append(f"{path}: @Autowired")

              lines = text.splitlines()
              depth = 0
              top_level_started = False
              for line in lines:
                  stripped = line.strip()
                  if not top_level_started and re.search(r"\b(class|record|enum)\s+\w+", stripped):
                      top_level_started = True

                  if top_level_started and depth == 1:
                      if re.match(r"\s*private\s+final\s+[^=;]+;\s*$", line):
                          violations.append(f"{path}: top-level uninitialized final field -> {stripped}")

                  depth += line.count("{") - line.count("}")

          if violations:
              raise SystemExit("\n".join(violations))

      - name: Spotless check
        run: >-
          bash mvnw -q -DskipTests
          -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist'
          com.diffplug.spotless:spotless-maven-plugin:3.10.2:check

      - name: Backend compile
        run: >-
          bash mvnw -q -DskipTests
          -pl '!yak-ops-ui,!yak-ops-dist'
          compile
