name: Scheduler Stage 6 Basic Workflow Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-basic-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-integration:
    name: Execute one Master workflow with H2 and fake Task
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run one upstream WorkflowStartBasicTestCase
        run: |
          bash mvnw -B -ntp -f yak-ops-scheduler/pom.xml \
            -pl :yak-ops-master -am \
            -Dtest=WorkflowStartBasicTestCase#testStartWorkflow_with_oneSuccessTask \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
      - name: Upload Surefire diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-basic-workflow-test-report
          path: 'yak-ops-scheduler/**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 7
