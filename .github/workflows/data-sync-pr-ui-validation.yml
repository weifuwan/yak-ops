name: Data Sync PR UI Validation

on:
  pull_request:
    paths:
      - 'yak-ops-ui/**'
      - '.github/workflows/data-sync-pr-ui-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-sync-pr-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Install UI dependencies
        working-directory: yak-ops-ui
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        working-directory: yak-ops-ui
        run: npm run typecheck
      - name: Production UI build
        working-directory: yak-ops-ui
        run: npm run build
