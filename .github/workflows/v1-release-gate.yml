name: Release Gate

on:
  # Formal release validation is manually triggered; ordinary PRs use Quality Check only.
  workflow_dispatch:
    inputs:
      release_version:
        description: Stable product version to validate and release.
        required: true
        default: "1.2.0"
        type: string
      manual_e2e_confirmed:
        description: All required Manual E2E listed in this version's readiness document passed.
        required: true
        default: false
        type: boolean
      migration_review_confirmed:
        description: All migrations shipped by this version completed final release review.
        required: true
        default: false
        type: boolean
      blockers_cleared:
        description: No open P0/P1 release blocker remains.
        required: true
        default: false
        type: boolean
      release_notes_confirmed:
        description: Release notes, readiness and known limitations are ready.
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    uses: ./.github/workflows/quality-check.yml

  backend-acceptance:
    name: Full Backend Acceptance
    uses: ./.github/workflows/backend-acceptance.yml
    with:
      full_sweep: true

  # Real JDBC driver/database checks run at release time, not for ordinary PRs.
  jdbc-source-acceptance:
    name: JDBC Source Acceptance
    uses: ./.github/workflows/jdbc-source-acceptance.yml

  jdbc-sink-acceptance:
    name: JDBC Sink Cross-Database Acceptance
    uses: ./.github/workflows/jdbc-sink-cross-database-acceptance.yml

  package-smoke:
    name: Distribution + Docker + Compose Smoke
    needs:
      - quality
      - backend-acceptance
      - jdbc-source-acceptance
      - jdbc-sink-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_version="${DISPATCH_VERSION}"
          else
            source release.env
            release_version="${YAK_OPS_VERSION}"
          fi

          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          echo "Release version: ${release_version}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json

      - name: Verify release metadata
        run: bash scripts/release/check-release-metadata.sh "v${RELEASE_VERSION}"

      - name: Verify release migration contract
        run: bash scripts/release/check-release-migration.sh "${RELEASE_VERSION}"

      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend
        working-directory: yak-ops-ui
        run: npm run build

      - name: Build distribution
        run: bash mvnw -B -ntp -DskipTests package

      - name: Verify distribution
        run: bash scripts/release/verify-distribution.sh "v${RELEASE_VERSION}"

      - name: Resolve build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "VCS_REF=$(git rev-parse --short HEAD)" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Build backend image
        shell: bash
        run: |
          set -euo pipefail
          source release.env
          docker build             --pull             --target backend-runtime             --build-arg "VERSION=${RELEASE_VERSION}"             --build-arg "VCS_REF=${VCS_REF}"             --build-arg "BUILD_DATE=${BUILD_DATE}"             --tag "${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"             .

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail
          source release.env
          docker build             --pull             --target frontend-runtime             --build-arg "VERSION=${RELEASE_VERSION}"             --build-arg "VCS_REF=${VCS_REF}"             --build-arg "BUILD_DATE=${BUILD_DATE}"             --tag "${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"             .

      - name: Verify image identity
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          for image in             "${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"             "${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"; do
            version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"

            test "${version}" = "${RELEASE_VERSION}"
            test "${revision}" = "${VCS_REF}"

            echo "OK  ${image} version=${version} revision=${revision}"
          done

      - name: Compose login smoke
        run: bash scripts/release/smoke-compose.sh "v${RELEASE_VERSION}"

      - name: Build release candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          source release.env

          mkdir -p release-evidence

          archive="yak-ops-${RELEASE_VERSION}.tar.gz"
          cp "yak-ops-dist/target/${archive}" release-evidence/
          cp yak-ops-dist/target/SHA256SUMS release-evidence/

          distribution_sha="$(awk -v file="${archive}" '$2 == file {print $1}' yak-ops-dist/target/SHA256SUMS)"
          backend_image="${DOCKERHUB_NAMESPACE}/yak-ops-api:${RELEASE_VERSION}"
          frontend_image="${DOCKERHUB_NAMESPACE}/yak-ops:${RELEASE_VERSION}"
          backend_id="$(docker image inspect --format '{{.Id}}' "${backend_image}")"
          frontend_id="$(docker image inspect --format '{{.Id}}' "${frontend_image}")"
          commit_sha="$(git rev-parse HEAD)"

          {
            printf '# Yak Ops %s Release Candidate Evidence\n\n' "${RELEASE_VERSION}"
            printf -- '- Product Version: `%s`\n' "${RELEASE_VERSION}"
            printf -- '- Candidate Commit: `%s`\n' "${commit_sha}"
            printf -- '- Workflow Run: `https://github.com/%s/actions/runs/%s`\n' "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf -- '- Distribution: `%s`\n' "${archive}"
            printf -- '- Distribution SHA-256: `%s`\n' "${distribution_sha}"
            printf -- '- Backend Image: `%s`\n' "${backend_image}"
            printf -- '- Backend Local Image ID: `%s`\n' "${backend_id}"
            printf -- '- Frontend Image: `%s`\n' "${frontend_image}"
            printf -- '- Frontend Local Image ID: `%s`\n' "${frontend_id}"
            printf -- '- Quality Gate: PASS\n'
            printf -- '- JDBC Source Acceptance: PASS\n'
            printf -- '- JDBC Sink Cross-Database Acceptance: PASS\n'
            printf -- '- Full Backend Acceptance: PASS\n'
            printf -- '- Data Sync Automation Acceptance: PASS\n'
            printf -- '- Distribution Verification: PASS\n'
            printf -- '- Docker Image Identity: PASS\n'
            printf -- '- Compose Login Smoke: PASS\n\n'
            printf '%s\n' 'Local image IDs are candidate-build evidence. Registry manifest digests are recorded only after immutable version tags are pushed during the publish step.'
          } > release-evidence/release-evidence.md

          cat release-evidence/release-evidence.md

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: yak-ops-${{ env.RELEASE_VERSION }}-release-candidate
          path: release-evidence/
          if-no-files-found: error
          retention-days: 14

  automated-release-gate:
    name: Automated Release Gate
    if: always()
    needs:
      - quality
      - backend-acceptance
      - jdbc-source-acceptance
      - jdbc-sink-acceptance
      - package-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Verify automated release results
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          ACCEPTANCE_RESULT: ${{ needs.backend-acceptance.result }}
          JDBC_SOURCE_RESULT: ${{ needs.jdbc-source-acceptance.result }}
          JDBC_SINK_RESULT: ${{ needs.jdbc-sink-acceptance.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          set -euo pipefail

          for result in "${QUALITY_RESULT}" "${ACCEPTANCE_RESULT}" "${JDBC_SOURCE_RESULT}" "${JDBC_SINK_RESULT}" "${PACKAGE_SMOKE_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Automated release gate failed: ${result}"
              exit 1
            fi
          done

          echo "Automated release gate passed."

  release-decision:
    name: Release Decision
    if: github.event_name == 'workflow_dispatch'
    needs:
      - automated-release-gate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      MANUAL_E2E_CONFIRMED: ${{ inputs.manual_e2e_confirmed }}
      MIGRATION_REVIEW_CONFIRMED: ${{ inputs.migration_review_confirmed }}
      BLOCKERS_CLEARED: ${{ inputs.blockers_cleared }}
      RELEASE_NOTES_CONFIRMED: ${{ inputs.release_notes_confirmed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release readiness confirmations
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Formal release decision must run from main, current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Formal release decision requires a stable X.Y.Z version: ${RELEASE_VERSION}"
            exit 1
          fi

          readiness="docs/release/v${RELEASE_VERSION}-readiness.md"
          notes="docs/release/v${RELEASE_VERSION}-release-notes.md"
          test -f "${readiness}"
          test -f "${notes}"
          test "$(grep -m1 '^Status:' "${readiness}")" = "Status: Ready"

          checks=(
            "Required Manual E2E:${MANUAL_E2E_CONFIRMED}"
            "Migration Review:${MIGRATION_REVIEW_CONFIRMED}"
            "Release Blockers Cleared:${BLOCKERS_CLEARED}"
            "Release Notes Ready:${RELEASE_NOTES_CONFIRMED}"
          )

          for check in "${checks[@]}"; do
            name="${check%%:*}"
            value="${check#*:}"
            if [[ "${value}" != "true" ]]; then
              echo "Missing release confirmation: ${name}"
              exit 1
            fi
          done

          echo "Yak Ops v${RELEASE_VERSION} release gate PASS."
          echo "This workflow does not create a Git tag or publish images."
