name: YakFlow Core Runtime Regression

on:
  pull_request:
    paths:
      - 'yak-ops-core/**'
      - 'yak-flow/yak-flow-runtime/**'
      - '.github/workflows/yakflow-core-runtime-regression.yml'

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Core must not depend on Runtime
        run: |
          if grep -R -n 'io\.yak\.ops\.flow\.runtime' yak-ops-core/src/main/java; then
            echo 'Unexpected core-to-runtime dependency'
            exit 1
          fi
      - name: YakFlow Core and Runtime tests
        run: bash mvnw -B -ntp -pl yak-flow/yak-flow-runtime -am test
