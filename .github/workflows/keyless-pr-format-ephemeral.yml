name: Keyless PR Format (temporary)
on:
  push:
    branches:
      - feat/keyless-cdc-e2e-product-enablement
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/keyless-cdc-e2e-product-enablement
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Format with project-locked formatter
        run: |
          npm ci --prefix yak-ops-ui --ignore-scripts
          cd yak-ops-ui
          npm run format
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yak-ops-ui/apps/web/app/data-sync/editor/source-section.tsx \
                  yak-ops-ui/apps/web/app/data-sync/editor/target-section.tsx \
                  yak-ops-ui/apps/web/service/data-sync/definition.ts \
                  yak-ops-ui/apps/web/service/data-sync/parameters.ts \
                  yak-ops-ui/scripts/verify-data-sync-definition.mjs \
                  yak-ops-ui/scripts/verify-data-sync-editor.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(ui): apply repository oxfmt to keyless changes'
          git push origin HEAD:feat/keyless-cdc-e2e-product-enablement
