name: Project Datasource PR Verification
on:
  pull_request:
    paths:
      - "yak-ops-api/**"
      - "yak-ops-dao/**"
      - "yak-ops-tools/**"
      - "yak-ops-ui/**"
      - ".github/workflows/pr-datasource-verification.yml"
jobs:
  format-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply backend Java format to workspace
        run: ./mvnw -B -pl yak-ops-api -am spotless:apply
      - name: Export formatted Java source as log (temporary verification)
        shell: bash
        run: |
          for f in $(git diff --name-only -- '*.java'); do
            echo "FORMATTED_FILE_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "FORMATTED_FILE_END:$f"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Frontend typecheck
        working-directory: yak-ops-ui
        run: npm ci && npm run typecheck
      - name: Frontend production build
        working-directory: yak-ops-ui
        run: npm run build
