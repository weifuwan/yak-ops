name: Code Format

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      backend_modules: ${{ steps.select.outputs.backend_modules }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select formatting scope
        id: select
        env:
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_CURRENT_SHA: ${{ github.sha }}
        run: python3 scripts/ci/ci_scope.py format

  frontend-format:
    name: Frontend Format
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yak-ops-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check Oxfmt formatting
        run: npm run format:check

  backend-format:
    name: Backend Format
    needs: scope
    if: needs.scope.outputs.backend_modules != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Spotless formatting
        env:
          BACKEND_MODULES: ${{ needs.scope.outputs.backend_modules }}
        run: |
          bash mvnw -B -ntp -pl "$BACKEND_MODULES" com.diffplug.spotless:spotless-maven-plugin:3.10.2:check

  format-check:
    name: Code Format Check
    if: always()
    needs: [scope, frontend-format, backend-format]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected format jobs to succeed
        env:
          SCOPE: ${{ needs.scope.result }}
          FRONTEND_SELECTED: ${{ needs.scope.outputs.frontend }}
          FRONTEND: ${{ needs.frontend-format.result }}
          BACKEND_MODULES: ${{ needs.scope.outputs.backend_modules }}
          BACKEND: ${{ needs.backend-format.result }}
        run: |
          test "$SCOPE" = success
          if [ "$FRONTEND_SELECTED" = true ]; then
            test "$FRONTEND" = success
          else
            test "$FRONTEND" = skipped
          fi
          if [ -n "$BACKEND_MODULES" ]; then
            test "$BACKEND" = success
          else
            test "$BACKEND" = skipped
          fi
