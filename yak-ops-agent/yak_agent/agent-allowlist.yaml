# Agent allowlist: the reviewed subset of the yak-ops REST API that agents may use.
#
# This file is the single source of truth for "which operations the agent can
# see and call". Every entry maps one contract operationId to one agent tool
# (the tool name defaults to operationId converted to snake_case, and is
# overridden by `tool` when the semantic name is clearer).
#
# risk levels: readonly (auto-allowed) | write | destructive (both require
# human confirmation via the HITL pause before execution).
#
# Validate with: python src/../scripts/check_agent_operations.py
#   (checks operationId existence in yak-ops-3.1.json and cross-checks the
#    agent's operations.yaml registry for path/method/param consistency)

version: 1
defaults:
  methods: [GET]

entries:
  # ---------------- read ----------------
  - operationId: listTasks
    tool: list_sync_tasks
    domain: data-sync
    risk: readonly
    note: 列出数据同步任务定义

  - operationId: getTask
    tool: get_sync_task
    domain: data-sync
    risk: readonly
    note: 获取任务定义详情（parameters 模板、revision、definitionVersion）

  - operationId: preview
    tool: preview_sync_task
    domain: data-sync
    risk: readonly
    note: 校验 pipeline 参数并渲染 YAML（无副作用）

  - operationId: overview
    tool: get_sync_overview
    domain: data-sync
    risk: readonly
    note: 数据同步概览

  - operationId: instances
    tool: list_sync_instances
    domain: data-sync
    risk: readonly
    note: 列出执行实例

  - operationId: getInstance
    tool: get_sync_instance_detail
    domain: data-sync
    risk: readonly
    note: 实例详情

  - operationId: queryLog
    tool: query_task_log
    domain: task-log
    risk: readonly
    note: 任务实例日志（分页）

  - operationId: downloadTaskLog
    tool: download_task_log
    domain: task-log
    risk: readonly
    note: 下载任务实例完整日志文件（PTC 分析用）

  # ---------------- datasource catalog (read) ----------------
  # 新建/修改同步任务需要真实的数据源、库、表和字段；只暴露只读目录接口。
  - operationId: queryDataSourceListPaging
    tool: list_data_sources
    domain: datasource
    risk: readonly
    note: 列出项目数据源（选择同步来源/目标）

  - operationId: queryDataSource
    tool: get_data_source
    domain: datasource
    risk: readonly
    note: 数据源详情（默认 database，密码脱敏）

  - operationId: getTables
    tool: list_data_source_tables
    domain: datasource
    risk: readonly
    note: 数据源下的表与主键（选择源表/目标表）

  - operationId: getTableColumns
    tool: list_data_source_columns
    domain: datasource
    risk: readonly
    note: 表字段（生成字段映射与主键配置）

  # ---------------- programmatic tool calling ----------------
  # 非 REST 操作（沙箱内执行的模型脚本），无契约 operationId 对应；
  # kind: script 让一致性校验跳过契约核对，但仍计入工具审定。
  - operationId: run_analysis_script
    tool: run_analysis_script
    domain: ptc
    kind: script
    risk: write
    note: PTC 分析脚本执行（默认关闭；开启后每次运行需人工确认；SDK 不含凭据，写操作在脚本内禁用）

  # ---------------- write (human confirmation) ----------------
  - operationId: createTask
    tool: create_sync_task
    domain: data-sync
    risk: write
    note: 创建任务（默认离线）

  - operationId: updateTask
    tool: update_sync_task
    domain: data-sync
    risk: write
    note: 修改任务定义（expectedRevision 乐观锁）

  - operationId: publish
    tool: publish_sync_task
    domain: data-sync
    risk: write
    note: 发布上线

  - operationId: unpublish
    tool: unpublish_sync_task
    domain: data-sync
    risk: write
    note: 下线

  - operationId: triggerWorkflowDefinition
    tool: run_sync_task
    domain: data-sync
    risk: write
    note: 手动运行已上线的同步任务（触发 workflow 实例）

  - operationId: deleteTask
    tool: delete_sync_task
    domain: data-sync
    risk: destructive
    note: 删除任务（不可恢复）

  # Task instance operations live in TaskInstanceController
  - operationId: stopTask
    tool: stop_task_instance
    domain: task-instance
    risk: destructive
    note: 停止运行中的实例

  - operationId: forceTaskSuccess
    tool: force_success_task_instance
    domain: task-instance
    risk: destructive
    note: 强制标记实例成功
