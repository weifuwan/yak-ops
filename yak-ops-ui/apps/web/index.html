<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Yak Ops</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #ffffff;
      }

      #yak-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }

      #yak-boot-splash svg {
        display: block;
        width: 48px;
        height: 48px;
        color: #b7bac0;
      }

      #yak-boot-splash .yak-boot-splash__highlight {
        animation: yak-loading-shimmer 2s linear infinite;
      }

      @keyframes yak-loading-shimmer {
        from {
          transform: translateX(0);
        }

        70%,
        to {
          transform: translateX(92px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #yak-boot-splash .yak-boot-splash__highlight {
          display: none;
        }
      }
    </style>
  </head>
