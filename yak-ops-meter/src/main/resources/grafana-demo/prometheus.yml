global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
scrape_configs:
  - job_name: 'YakOps'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:5679' # Change the address to the address of YakOps master server
          - 'host.docker.internal:1235' # Change the address to the address of YakOps worker server
          - 'host.docker.internal:50053' # Change the address to the address of YakOps alert server
  - job_name: 'YakOps-Standalone'
    metrics_path: '/yak-ops/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:12345' # Change the address to the YakOps standalone server
