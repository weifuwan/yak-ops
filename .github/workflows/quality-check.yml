name: Quality Check

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A single scope classifier runs in existing jobs, not in an extra Actions job.
# Reusable Release Gate invocations are deliberately treated as full-quality runs.
env:
  CI_EVENT_NAME: ${{ github.event_name }}
  CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
  CI_CURRENT_SHA: ${{ github.sha }}

concurrency:
  group: quality-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.impact.outputs.backend }}
      frontend: ${{ steps.impact.outputs.frontend }}
      distribution: ${{ steps.impact.outputs.distribution }}
      release: ${{ steps.impact.outputs.release }}
      tests: ${{ steps.impact.outputs.tests }}
      modules: ${{ steps.impact.outputs.modules }}
      suites: ${{ steps.impact.outputs.suites }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect changed modules and tests
        id: impact
        run: bash scripts/ci/detect-changes.sh
      - name: Verify change selection
        run: |
          bash scripts/ci/test-detect-changes.sh
          python3 -m unittest discover -s scripts/ci -p 'test_impact.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  backend-quality:
    name: Backend Quality
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend logging rules
        run: |
          python3 scripts/ci/test_logging_rules.py
          python3 scripts/verify_logging_rules.py
      - name: Verify changed Maven modules and upstream dependencies
        env:
          CI_MODULES: ${{ needs.scope.outputs.modules }}
        run: |
          test -n "${CI_MODULES}"
          bash mvnw -B -ntp -pl "${CI_MODULES}" -am verify
      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-failures
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 7

  release-checks:
    name: Release Checks
    needs: scope
    if: needs.scope.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Release tooling syntax
        run: bash -n scripts/release/*.sh
      - name: Release metadata consistency
        run: bash scripts/release/check-release-metadata.sh
      - name: Release migration contract
        run: |
          source release.env
          bash scripts/release/check-release-migration.sh "$YAK_OPS_VERSION"
      - name: Release notes structure
        run: |
          source release.env
          bash scripts/release/check-release-notes.sh "$YAK_OPS_VERSION"

  frontend-quality:
    name: Frontend Quality
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yak-ops-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Frontend format
        run: npm run format:check

      - name: Frontend lint
        run: npm run lint

      - name: Frontend type check
        run: npm run typecheck

      - name: Frontend architecture
        run: npm run architecture:check

      - name: Frontend contract
        run: npm run contract:check

      - name: Frontend build
        run: npm run build


  distribution-quality:
    name: Distribution Quality
    needs: scope
    if: needs.scope.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend distribution
        working-directory: yak-ops-ui
        run: npm run build

      - name: Build Yak Ops distribution
        run: bash mvnw -B -ntp -DskipTests package

      - name: Verify Yak Ops distribution
        run: bash scripts/release/verify-distribution.sh

  # On PRs, run affected real-database tests as part of this workflow. The
  # standalone Backend Tests workflow remains available manually and for releases.
  backend-tests:
    name: Affected Backend Tests
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.tests == 'true'
    uses: ./.github/workflows/backend-tests.yml
    with:
      suite: auto

  # One stable PR result: quality and selected Backend Tests must all succeed.
  # On main pushes and Release Gate quality calls Backend Tests is deliberately skipped.
  pr-required-checks:
    name: PR Required Checks
    permissions:
      contents: read
      actions: read
    if: ${{ always() }}
    needs:
      - scope
      - backend-quality
      - frontend-quality
      - distribution-quality
      - release-checks
      - backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify quality and selected backend tests
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECT_BACKEND: ${{ needs.scope.outputs.backend }}
          SELECT_FRONTEND: ${{ needs.scope.outputs.frontend }}
          SELECT_DISTRIBUTION: ${{ needs.scope.outputs.distribution }}
          SELECT_RELEASE: ${{ needs.scope.outputs.release }}
          SELECT_TESTS: ${{ needs.scope.outputs.tests }}
          RELEASE_RESULT: ${{ needs.release-checks.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution-quality.result }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "## PR Required Checks" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Check | Required | Result |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| --- | --- | --- |" >> "${GITHUB_STEP_SUMMARY}"
          [[ "${SCOPE_RESULT}" == "success" ]] || { echo "::error::Change selection failed"; exit 1; }
          failed=0
          checks=(
            "Backend Quality:${SELECT_BACKEND}:${BACKEND_RESULT}"
            "Frontend Quality:${SELECT_FRONTEND}:${FRONTEND_RESULT}"
            "Distribution Quality:${SELECT_DISTRIBUTION}:${DISTRIBUTION_RESULT}"
            "Release Checks:${SELECT_RELEASE}:${RELEASE_RESULT}"
          )
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            checks+=("Affected Backend Tests:${SELECT_TESTS}:${BACKEND_TESTS_RESULT}")
          fi
          for check in "${checks[@]}"; do
            name="${check%%:*}"
            rest="${check#*:}"
            required="${rest%%:*}"
            actual="${rest#*:}"
            echo "| ${name} | ${required} | ${actual} |" >> "${GITHUB_STEP_SUMMARY}"
            if [[ "${required}" == "true" && "${actual}" != "success" ]] || [[ "${required}" != "true" && "${actual}" != "skipped" ]]; then
              echo "::error::${name} expected ${required}, got ${actual}"
              failed=1
            fi
          done
          exit "${failed}"
      - name: CI Timing Report
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/report_timing.py
