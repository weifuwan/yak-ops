name: Verify DolphinScheduler import provenance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify retained upstream manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('docs/scheduler/MIGRATION_MANIFEST.json')
          assert manifest.is_file(), 'Missing upstream import manifest'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data['pom_count'] >= 40
          assert data['imported_files'] >= 1000
          print('Historical upstream source inventory verified:', data['pom_count'], 'POMs')
          PY
