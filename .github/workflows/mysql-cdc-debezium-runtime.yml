name: MySQL CDC Debezium Runtime Verification

on:
  pull_request:
    paths:
      - 'yak-flow/yak-flow-connector-cdc-mysql/**'
      - '.github/workflows/mysql-cdc-debezium-runtime.yml'
      - 'scripts/tests/backend_tests.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-contract:
    name: Compile and Debezium 2.7 contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compile/test phases avoid the unrelated baseline Spotless violations
      # currently blocking the repository-wide verify lifecycle.
      - name: Compile MySQL CDC and reactor dependencies
        run: bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql -am -DskipTests compile
      - name: Install reactor dependencies without unrelated upstream test compilation
        run: >
          bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql -am
          -Dmaven.test.skip=true -Dspotless.check.skip=true -Dcheckstyle.skip=true install
      - name: Verify all MySQL CDC unit tests
        run: bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql test
      # Temporary review tool; removed after applying the repository's formatter.
      - name: Export Palantir-formatted MySQL CDC sources for PR cleanup
        if: always()
        run: |
          bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql \
            com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          names = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          for name in names:
              if name.endswith(".java") and name.startswith("yak-flow/yak-flow-connector-cdc-mysql/"):
                  content = pathlib.Path(name).read_text(encoding="utf-8")
                  print("YAKFORMATTED:" + json.dumps({"path": name, "content": content}, ensure_ascii=True, separators=(",", ":")), flush=True)
          PY

