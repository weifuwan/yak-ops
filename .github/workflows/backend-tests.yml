name: Backend Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'pom.xml'
      - 'yak-ops-alert/**'
      - 'yak-ops-api/**'
      - 'yak-ops-authentication/**'
      - 'yak-ops-bom/**'
      - 'yak-ops-common/**'
      - 'yak-ops-dao/**'
      - 'yak-ops-dao-plugin/**'
      - 'yak-ops-datasource-plugin/**'
      - 'yak-ops-eventbus/**'
      - 'yak-ops-extract/**'
      - 'yak-ops-master/**'
      - 'yak-ops-meter/**'
      - 'yak-ops-registry/**'
      - 'yak-ops-scheduler-plugin/**'
      - 'yak-ops-service/**'
      - 'yak-ops-spi/**'
      - 'yak-ops-standalone-server/**'
      - 'yak-ops-storage-plugin/**'
      - 'yak-ops-task-executor/**'
      - 'yak-ops-task-plugin/**'
      - 'yak-ops-tools/**'
      - 'yak-ops-worker/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'yak-ops-alert/**'
      - 'yak-ops-api/**'
      - 'yak-ops-authentication/**'
      - 'yak-ops-bom/**'
      - 'yak-ops-common/**'
      - 'yak-ops-dao/**'
      - 'yak-ops-dao-plugin/**'
      - 'yak-ops-datasource-plugin/**'
      - 'yak-ops-eventbus/**'
      - 'yak-ops-extract/**'
      - 'yak-ops-master/**'
      - 'yak-ops-meter/**'
      - 'yak-ops-registry/**'
      - 'yak-ops-scheduler-plugin/**'
      - 'yak-ops-service/**'
      - 'yak-ops-spi/**'
      - 'yak-ops-standalone-server/**'
      - 'yak-ops-storage-plugin/**'
      - 'yak-ops-task-executor/**'
      - 'yak-ops-task-plugin/**'
      - 'yak-ops-tools/**'
      - 'yak-ops-worker/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Show Maven version
        run: mvn --version
      - name: Compile API dependencies and execute API tests only (parallel reactor)
        shell: bash
        run: |
          # -am builds API upstream dependencies, but Surefire only selects tests
          # under io.yak.ops.api. Other backend modules are not test targets.
          # The hosted runner already has Maven; using mvn avoids wrapper JAR
          # downloads (which can fail with Maven Central HTTP 429).
          mvn -B -ntp -T 2 -pl :yak-ops-api -am \
            '-Dtest=%regex[io/yak/ops/api/.*Test.*]' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DexcludedGroups=slow \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true \
            test
      - name: Require executed API tests and no unrelated backend tests
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          reports = list(Path('yak-ops-api/target/surefire-reports').glob('TEST-*.xml'))
          total = sum(int(ET.parse(report).getroot().attrib.get('tests', 0)) for report in reports)
          print(f'API reports: {len(reports)}, tests: {total}')
          if total == 0:
              raise SystemExit('No yak-ops-api tests executed')

          unrelated = [
              report for report in Path('.').glob('yak-ops-*/**/target/surefire-reports/TEST-*.xml')
              if not str(report).startswith('yak-ops-api/')
          ]
          if unrelated:
              raise SystemExit(f'Unexpected test execution outside API: {unrelated[:5]}')
          PY
      - name: Upload API test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: yak-ops-api/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

  data-sync-plugin:
    name: Data Sync Plugin Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check if Data Sync plugin changed
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(yak-ops-task-plugin/yak-ops-task-data-sync/|yak-ops-datasource-plugin/yak-ops-datasource-api/|pom.xml$|yak-ops-bom/)'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Data Sync plugin unit tests
        if: steps.changed.outputs.run_tests == 'true'
        shell: bash
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-task-data-sync -am \
            '-Dtest=DataSyncParametersTest,DataSyncPipelineBuilderTest,DataSyncJobRunnerTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
      - name: Require executed Data Sync plugin tests
        if: steps.changed.outputs.run_tests == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          reports = list(Path('yak-ops-task-plugin/yak-ops-task-data-sync/target/surefire-reports').glob('TEST-*.xml'))
          total = sum(int(ET.parse(report).getroot().attrib.get('tests', 0)) for report in reports)
          print(f'Data Sync test reports: {len(reports)}, tests: {total}')
          if total == 0:
              raise SystemExit('No Data Sync plugin unit tests executed')
          PY
