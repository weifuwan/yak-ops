name: Scheduler Stage 6 Workflow Unit Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-workflow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-tests:
    name: Master workflow and task state-machine tests (JDK 11)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Test selected workflow/task lifecycle behavior
        run: |
          bash mvnw -B -ntp -f yak-ops-scheduler/pom.xml \
            -pl :yak-ops-master -am \
            -Dtest=TaskRetryLifecycleEventTest,TaskForceSuccessStateActionTest,WorkflowInstanceRepeatTriggerTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
