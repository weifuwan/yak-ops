name: Backend Acceptance (runtime integration pending)

on:
  workflow_call:
    inputs:
      full_sweep:
        description: Require full Data Sync acceptance for a release gate.
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: backend-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-gate:
    name: Runtime E2E Acceptance — Not Available
    runs-on: ubuntu-latest
    steps:
      - name: Report acceptance status
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_SWEEP: ${{ inputs.full_sweep }}
        run: |
          set -euo pipefail
          echo "::warning::Data Sync UI, Controller, Service, DAO and JDBC/CDC connector code are retained, but the old execution engine was removed and no replacement is integrated. End-to-end execution is not verified."
          if [[ "${FULL_SWEEP}" == "true" || "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "schedule" ]]; then
            echo "::error::Full runtime acceptance is unavailable; new engine integration and E2E are required before release."
            exit 1
          fi
          echo "Only the acceptance-unavailable state is reported, not a runtime acceptance PASS."
