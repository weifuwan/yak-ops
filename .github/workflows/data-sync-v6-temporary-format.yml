name: Data Sync V6 Temporary Formatter
on:
  push:
    branches:
      - refactor/data-sync-v6-flink-cdc-pipeline
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/data-sync-v6-flink-cdc-pipeline
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Apply Java formatting
        run: mvn -q -ntp -pl yak-ops-core,yak-ops-data-sync-runtime,yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync -am com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply -DskipTests
      - name: Apply frontend formatting
        working-directory: yak-ops-ui
        run: |
          npm ci --no-audit --no-fund
          npm run format
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format V6 Java and frontend sources"
            git push origin HEAD:refactor/data-sync-v6-flink-cdc-pipeline
          fi
