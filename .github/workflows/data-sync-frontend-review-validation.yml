name: Data Sync Frontend Review Validation
on:
  push:
    branches:
      - feature/data-sync-cdc-pipeline-mvp
    paths:
      - 'yak-ops-ui/**'
      - '.github/workflows/data-sync-frontend-review-validation.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Install UI dependencies
        working-directory: yak-ops-ui
        run: npm ci
      - name: TypeScript
        working-directory: yak-ops-ui
        run: npm run typecheck
      - name: Production build
        working-directory: yak-ops-ui
        run: npm run build
      - name: Frontend contract tests
        working-directory: yak-ops-ui
        run: npm run test:datasource && npm run test:auth
