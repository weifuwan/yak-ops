name: One-time Flink CDC source import

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/cdc-source-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sources:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Yak Ops dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
      - name: Download upstream Apache Flink CDC 3.7.0
        run: |
          git clone --depth 1 --branch release-3.7.0 https://github.com/apache/flink-cdc.git "$RUNNER_TEMP/flink-cdc"
      - name: Replace CDC module with upstream Java source and tests
        run: |
          python3 scripts/import_flink_cdc_3_7.py "$RUNNER_TEMP/flink-cdc" yak-ops-cdc
      - name: Commit and push source migration to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A yak-ops-cdc
          if ! git diff --cached --quiet; then
            git commit -m "refactor(cdc): replace standalone runtime with upstream Flink CDC 3.7 MySQL source"
            git push origin HEAD:dev
          fi
