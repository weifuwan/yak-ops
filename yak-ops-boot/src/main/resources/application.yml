server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: yak-ops
  datasource:
    url: ${YAK_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/yak_ops?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${YAK_DATABASE_USERNAME:root}
    password: ${YAK_DATABASE_PASSWORD:}
    hikari:
      pool-name: YakOpsDatabasePool
      minimum-idle: ${YAK_DATABASE_MINIMUM_IDLE:1}
      maximum-pool-size: ${YAK_DATABASE_MAXIMUM_POOL_SIZE:8}
  # yak-ops-dao owns Flyway migration initialization.
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

springdoc:
  swagger-ui:
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha

yak:
  security:
    application-name: ${YAK_SECURITY_APPLICATION_NAME:${spring.application.name}}
    authentication:
      idle-timeout: ${YAK_SECURITY_AUTHENTICATION_IDLE_TIMEOUT:30m}
    bootstrap:
      enabled: ${YAK_SECURITY_BOOTSTRAP_ENABLED:false}
      username: ${YAK_SECURITY_BOOTSTRAP_USERNAME:root}
      password: ${YAK_SECURITY_BOOTSTRAP_PASSWORD:}
      real-name: ${YAK_SECURITY_BOOTSTRAP_REAL_NAME:系统管理员}

  task:
    logging:
      directory: ${YAK_TASK_LOG_DIRECTORY:logs/tasks}
      max-history-days: ${YAK_TASK_LOG_RETENTION_DAYS:7}

  datasource:
    connection-test-timeout-seconds: ${YAK_DATASOURCE_CONNECT_TIMEOUT_SECONDS:5}

logging:
  file:
    name: ${YAK_LOG_FILE:logs/yak-ops.log}
  level:
    root: INFO
    io.yak.ops: ${YAK_LOG_LEVEL:INFO}
  logback:
    rollingpolicy:
      file-name-pattern: ${YAK_LOG_FILE_PATTERN:logs/yak-ops.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${YAK_LOG_MAX_FILE_SIZE:100MB}
      max-history: ${YAK_LOG_MAX_HISTORY:7}
      total-size-cap: ${YAK_LOG_TOTAL_SIZE_CAP:5GB}

# DolphinScheduler embedded JDBC registry
registry:
  type: jdbc
  heartbeat-refresh-interval: PT3S
  session-timeout: PT60S
