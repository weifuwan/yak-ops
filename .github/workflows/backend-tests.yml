name: Backend Tests

on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: false
        default: full
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        required: true
        default: full
        options:
          - full
          - business
          - cdc

permissions:
  contents: read

# Reusable PR runs inherit pull_request context from Quality Check. Manual and
# Release Gate runs use their own independent run ID.
concurrency:
  group: backend-tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test suite selection and report validation
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Check registered integration tests
        run: python3 scripts/tests/backend_tests.py registration
      - name: Select suites from the complete PR diff
        id: select
        env:
          REQUESTED_SUITE: ${{ inputs.suite || 'auto' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/tests/backend_tests.py select "$REQUESTED_SUITE"

  tests:
    name: Backend Tests (${{ matrix.suite }})
    needs: scope
    if: needs.scope.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Bound Docker/Testcontainers load while avoiding long waits behind two suites.
      max-parallel: 8
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run native Maven tests with isolated databases
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: bash scripts/tests/run.sh "$TEST_SUITE"
      - name: Upload reports and process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.suite }}
          path: |
            **/target/failsafe-reports/**
            **/target/surefire-reports/**
            **/target/test-artifacts/**
          if-no-files-found: error
          retention-days: 7

  backend-tests-check:
    name: Backend Tests Check
    if: always()
    needs: [scope, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require every selected suite to succeed
        env:
          SELECTED_SUITES: ${{ needs.scope.outputs.suites || '[]' }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: python3 scripts/tests/backend_tests.py check
