name: Data Sync UI Validation

on:
  pull_request:
    paths:
      - 'yak-ops-ui/**'
      - '.github/workflows/data-sync-ui-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yak-ops-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:data-sync

  serial-command-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test shared workflow serial-command claim
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-master -am \
            '-Dtest=SerialCommandLaunchTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true \
            test
