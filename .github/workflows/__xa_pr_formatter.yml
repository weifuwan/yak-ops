name: Temporary XA PR Formatter

on:
  push:
    branches:
      - feat/jdbc-xa-checkpoint-commit-coordination
    paths:
      - .github/workflows/__xa_pr_formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/jdbc-xa-checkpoint-commit-coordination
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
      - name: Apply repository backend format
        run: bash mvnw -B -ntp -DskipTests -pl yak-ops-core,yak-flow/yak-flow-runtime,yak-flow/yak-flow-connector-jdbc,yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Apply repository frontend format
        working-directory: yak-ops-ui
        run: npm run format
      - name: Commit formatter output to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(xa): apply Spotless and oxfmt"
            git push origin HEAD:feat/jdbc-xa-checkpoint-commit-coordination
          fi
