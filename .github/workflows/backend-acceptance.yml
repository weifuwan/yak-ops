name: Backend Acceptance

on:
  workflow_call:
    inputs:
      full_sweep:
        description: Require real Task execution product acceptance for a release.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-status:
    name: Product E2E Status (not executed)
    if: ${{ inputs.full_sweep != true && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report product acceptance status
        shell: bash
        run: |
          echo "::notice::Product E2E was not requested; this informational result is not acceptance evidence."
          {
            echo "## Task Execution Product E2E: NOT EXECUTED"
            echo ""
            echo "Pass full_sweep=true or run the Product Acceptance workflow to obtain real database evidence."
          } >> "${GITHUB_STEP_SUMMARY}"

  full-acceptance:
    name: Full Task Execution Product E2E
    if: ${{ inputs.full_sweep == true || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/task-execution-product-acceptance.yml
