name: CDC Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'pom.xml'
      - 'yak-ops-bom/**'
      - 'yak-ops-cdc/**'
      - '.github/workflows/cdc-tests.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'yak-ops-bom/**'
      - 'yak-ops-cdc/**'
      - '.github/workflows/cdc-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdc-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdc-unit:
    name: All CDC Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Show Maven version
        run: mvn --version
      - name: Run all CDC module tests (including test compilation)
        shell: bash
        run: |
          mapfile -t modules < <(find yak-ops-cdc -type f -name pom.xml | sed 's@/pom.xml$@@' | sort)
          module_csv=$(IFS=,; echo "${modules[*]}")
          test -n "$module_csv"
          mvn -B -ntp -T 2 -fae -pl "$module_csv" -am \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
      - name: Require executed CDC tests
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = [p for p in Path('yak-ops-cdc').rglob('TEST-*.xml') if 'surefire-reports' in p.parts]
          total = sum(int(ET.parse(p).getroot().attrib.get('tests', 0)) for p in reports)
          print(f'CDC reports: {len(reports)}, tests: {total}')
          if total == 0:
              raise SystemExit('No CDC tests executed')
          PY
      - name: Upload CDC test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-test-reports
          path: yak-ops-cdc/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

  postgres-integration:
    name: PostgreSQL CDC Integration Tests and Shaded JAR (JDK 17 + Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Docker availability
        run: |
          docker version
          docker info
      - name: Configure Docker API compatibility for Testcontainers
        run: |
          printf 'api.version=1.44\n' > "$HOME/.docker-java.properties"
          cat "$HOME/.docker-java.properties"
      - name: Build PostgreSQL connectors and CLI; run integration tests
        run: |
          mvn -B -ntp -T 2 -fae \
            -pl :yak-ops-cdc-cli,:yak-ops-connector-postgres-cdc,:yak-ops-cdc-pipeline-connector-postgres -am \
            -DskipUT=false -DskipITs=false \
            -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true \
            clean verify
      - name: Verify CLI runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl :yak-ops-cdc-cli -am dependency:tree \
            -Dscope=runtime \
            -Dincludes=io.yak.ops:yak-ops-cdc-pipeline-connector-postgres \
            | tee /tmp/postgres-cli-runtime-dependency-tree.log
          grep -F 'io.yak.ops:yak-ops-cdc-pipeline-connector-postgres:jar:1.4.0:runtime' \
            /tmp/postgres-cli-runtime-dependency-tree.log
      - name: Verify shaded PostgreSQL Pipeline JAR and SPI registrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jar = Path(
              "yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/"
              "yak-ops-cdc-pipeline-connector-postgres/target/"
              "yak-ops-cdc-pipeline-connector-postgres-1.4.0-shade.jar"
          )
          if not jar.is_file():
              raise SystemExit(f"Shaded PostgreSQL Pipeline JAR not found: {jar}")

          expected_services = {
              "META-INF/services/org.apache.flink.cdc.common.factories.Factory":
                  "org.apache.flink.cdc.connectors.postgres.factory.PostgresDataSourceFactory",
              "META-INF/services/org.apache.flink.table.factories.Factory":
                  "org.apache.flink.cdc.connectors.postgres.table.PostgreSQLTableFactory",
          }
          expected_classes = {
              "org/apache/flink/cdc/connectors/postgres/factory/PostgresDataSourceFactory.class",
              "org/apache/flink/cdc/connectors/postgres/table/PostgreSQLTableFactory.class",
          }

          with ZipFile(jar) as archive:
              entries = set(archive.namelist())
              for entry in expected_classes:
                  if entry not in entries:
                      raise SystemExit(f"Missing connector class in shaded JAR: {entry}")
              for service, provider in expected_services.items():
                  if service not in entries:
                      raise SystemExit(f"Missing SPI descriptor in shaded JAR: {service}")
                  providers = {
                      line.strip()
                      for line in archive.read(service).decode("utf-8").splitlines()
                      if line.strip() and not line.lstrip().startswith("#")
                  }
                  if provider not in providers:
                      raise SystemExit(f"Missing SPI provider {provider} in {service}")

          print(f"Verified shaded JAR: {jar}")
          print("Verified PostgreSQL Source and Pipeline factory classes and SPI registrations.")
          PY
      - name: Require executed PostgreSQL integration tests
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          modules = [
              Path("yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-source-connectors/yak-ops-connector-postgres-cdc"),
              Path("yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-postgres"),
          ]
          failed = False
          for module in modules:
              reports = list((module / "target" / "failsafe-reports").glob("TEST-*.xml"))
              tests = skipped = 0
              for report in reports:
                  root = ET.parse(report).getroot()
                  tests += int(root.attrib.get("tests", 0))
                  skipped += int(root.attrib.get("skipped", 0))
              executed = tests - skipped
              print(f"{module.name}: reports={len(reports)}, tests={tests}, skipped={skipped}, executed={executed}")
              if not reports or executed <= 0:
                  failed = True
          if failed:
              raise SystemExit("PostgreSQL integration tests did not execute in both connector modules.")
          PY
      - name: Upload PostgreSQL test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-cdc-test-reports
          path: |
            yak-ops-cdc/**/target/surefire-reports/**
            yak-ops-cdc/**/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7
