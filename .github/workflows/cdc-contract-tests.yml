name: CDC Contract Tests

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/cdc-contract-tests.yml'
      - 'yak-ops-cdc/**'
      - 'yak-ops-bom/pom.xml'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdc-definition-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run CDC common, composer and CLI contract tests
        run: bash mvnw -B -ntp -pl yak-ops-cdc/yak-ops-cdc-cli -am test
