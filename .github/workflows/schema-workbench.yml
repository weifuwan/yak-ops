name: Schema Migration Workbench
on:
  push:
    branches: [workbench/schema-1643-20261014]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Reconstruct clean code candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .workbench/schema.delta2.* | gzip -d > /tmp/schema.patch
          echo 'deb6fb857387cff3ce6ecd5e623a2dcbe4c82dcd559c55ecb5eadc1f3dc09ba1  /tmp/schema.patch' | sha256sum -c -
          git worktree add --detach /tmp/yak-candidate 21c22c9eea4f5f87033714363dd11f6b88d6179c
          cd /tmp/yak-candidate
          git apply --unidiff-zero /tmp/schema.patch
          # Workflow changes are submitted separately through the authorized maintainer connector.
          git restore --source=21c22c9eea4f5f87033714363dd11f6b88d6179c .github/workflows/task-execution-product-acceptance.yml
          git diff --check
          test ! -d .workbench
          test ! -f .github/workflows/schema-workbench.yml
      - name: Format using repository tools
        working-directory: /tmp/yak-candidate
        run: |
          bash mvnw -B -ntp -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          npm ci --prefix yak-ops-ui --no-audit --no-fund
          npm run format --prefix yak-ops-ui
          python3 -m py_compile scripts/acceptance/schema_migration_e2e.py scripts/acceptance/schema_migration_browser.py
      - name: Preserve implementation for PR CI
        working-directory: /tmp/yak-candidate
        env:
          CANDIDATE_BRANCH: workbench/schema-1643-candidate-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'feat(data-sync): complete schema cancellation, observations and end-to-end acceptance'
          git push origin HEAD:refs/heads/$CANDIDATE_BRANCH
          git rev-parse HEAD | tee /tmp/candidate-sha.txt
          git archive --format=zip HEAD -o /tmp/candidate-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: schema-completion-candidate
          path: |
            /tmp/candidate-source.zip
            /tmp/candidate-sha.txt
          retention-days: 1
