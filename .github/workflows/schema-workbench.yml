name: Schema Migration Workbench
on:
  push:
    branches: [workbench/schema-1643-20261014]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge current main without losing either verification suite
        shell: bash
        env:
          CANDIDATE_BRANCH: workbench/schema-1643-candidate-${{ github.run_id }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/yak-candidate 2b35a4e21a5cd951f46ee87b3ad8082866ac28b4
          cd /tmp/yak-candidate
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          if ! git merge --no-commit --no-ff 95af7412d4169b39ff34463d323165739d8ac388; then
            test "$(git diff --name-only --diff-filter=U)" = 'yak-ops-ui/package.json'
            git checkout --ours yak-ops-ui/package.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('yak-ops-ui/package.json')
          value = json.loads(p.read_text())
          script = value['scripts']['contract:check']
          assert 'verify-schema-migration.mjs' in script
          if 'verify-primary-color-tokens.mjs' not in script:
              script += ' && node scripts/verify-primary-color-tokens.mjs'
          value['scripts']['contract:check'] = script
          p.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')
          PY
            git add yak-ops-ui/package.json
          fi
          # Publish the one-line workflow trigger through the maintainer connector, not GITHUB_TOKEN.
          git restore --source=95af7412d4169b39ff34463d323165739d8ac388 --staged --worktree .github/workflows/task-execution-product-acceptance.yml
          git diff --check
          test ! -d .workbench
          test ! -f .github/workflows/schema-workbench.yml
          git commit -m 'merge: retain main primary color checks alongside schema migration acceptance'
          git push origin HEAD:refs/heads/$CANDIDATE_BRANCH
          git rev-parse HEAD | tee /tmp/candidate-sha.txt
          git archive --format=zip HEAD -o /tmp/candidate-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: schema-aligned-candidate
          path: |
            /tmp/candidate-source.zip
            /tmp/candidate-sha.txt
          retention-days: 1
