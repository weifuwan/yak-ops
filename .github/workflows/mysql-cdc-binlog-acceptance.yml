name: MySQL CDC Binlog Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-binlog-it:
    name: MySQL Binlog + Offset Recovery IT
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start disposable MySQL with ROW Binlog and FULL images
        run: |
          docker run -d --name yak-cdc-mysql \
            -e MYSQL_ROOT_PASSWORD=rootpass -e MYSQL_DATABASE=yak_cdc_it \
            -p 3306:3306 mysql:8.0 \
            --server-id=5550 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL
          for attempt in $(seq 1 90); do
            if docker exec yak-cdc-mysql mysqladmin ping --host=127.0.0.1 --user=root --password=rootpass --silent; then
              exit 0
            fi
            sleep 2
          done
          docker logs yak-cdc-mysql
          exit 1
      - name: Verify real MySQL Binlog and checkpoint restoration
        run: >
          bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql -am
          -Dtest=MySqlBinlogIT -Dsurefire.failIfNoSpecifiedTests=false
          -Dmysql.cdc.it.enabled=true -Dmysql.cdc.it.password=rootpass test
      - name: Database logs on failure
        if: failure()
        run: docker logs yak-cdc-mysql
