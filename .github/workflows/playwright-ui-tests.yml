name: Playwright UI Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'yak-ops-ui/tests/e2e/**'
      - '.github/workflows/playwright-ui-tests.yml'
  # Run on Playwright changes; normal feature PRs use frontend checks.
  pull_request:
    paths:
      - 'yak-ops-ui/tests/e2e/**'
      - '.github/workflows/playwright-ui-tests.yml'

permissions:
  contents: read

jobs:
  ui-contracts:
    name: Playwright (Mocked UI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build production frontend
        working-directory: yak-ops-ui
        run: npm run build
      - name: Serve production frontend
        working-directory: yak-ops-ui
        run: |
          npm exec -- vite preview --config apps/web/vite.config.ts --host 127.0.0.1 --port 5173 --strictPort > /tmp/yak-ui-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/yak-ui-preview.log
          exit 1
      - name: Install pinned Playwright and Chromium
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Run Playwright UI tests
        run: |
          python3 -u yak-ops-ui/tests/e2e/run.py --suite mocked --base-url http://127.0.0.1:5173 --version "$(node -p "require('./yak-ops-ui/package.json').version")" --sha "$GITHUB_SHA"
      - name: Preview logs on failure
        if: failure()
        run: tail -n 100 /tmp/yak-ui-preview.log || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-tests
          path: /tmp/yak-playwright/
          if-no-files-found: ignore
          retention-days: 14
