name: Temporary Format PR 1263

on:
  push:
    branches:
      - feat/datasource-advanced-properties-combobox

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/datasource-advanced-properties-combobox

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json

      - name: Install dependencies
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Format frontend
        working-directory: yak-ops-ui
        run: npm run format

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yak-ops-ui
          git commit -m "style: apply frontend formatter"
          git push origin HEAD:feat/datasource-advanced-properties-combobox
