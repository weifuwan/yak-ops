version: '2.1'

services:
  prom:
    image: prom/prometheus
    networks: [ test ]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    networks: [ test ]
    ports:
      # due to the DolphinScheduler frontend port is 3000, so we change the grafana default port to 3001.
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../grafana:/dashboards:ro
      - ./datasources:/etc/grafana/provisioning/datasources:ro
      - ./dashboards/provisioning.yaml:/etc/grafana/provisioning/dashboards/provisioning.yaml:ro

networks:
  test:
