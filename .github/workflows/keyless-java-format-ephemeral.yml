name: Keyless Java Spotless (temporary)
on:
  push:
    branches:
      - feat/keyless-cdc-e2e-product-enablement
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/keyless-cdc-e2e-product-enablement
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Spotless config
        run: |
          mvn -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql,yak-flow/yak-flow-connector-jdbc,yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Commit only keyless PR Java files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/source/MySqlCdcSourceFactory.java \
                  yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/source/MySqlCdcSourceOptions.java \
                  yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/source/reader/MySqlHybridSplitReader.java \
                  yak-flow/yak-flow-connector-cdc-mysql/src/test/java/io/yak/ops/connector/cdc/mysql/source/MySqlKeylessSourceContractTest.java \
                  yak-flow/yak-flow-connector-cdc-mysql/src/test/java/io/yak/ops/connector/cdc/mysql/source/MySqlHybridIT.java \
                  yak-flow/yak-flow-connector-jdbc/src/main/java/io/yak/ops/connector/jdbc/sink/JdbcSinkFactory.java \
                  yak-flow/yak-flow-connector-jdbc/src/test/java/io/yak/ops/connector/jdbc/sink/JdbcKeylessRetractionContractTest.java \
                  yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync/src/main/java/io/yak/ops/plugin/task/datasync/config/SolutionOptions.java \
                  yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync/src/main/java/io/yak/ops/plugin/task/datasync/config/JobConfig.java \
                  yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync/src/main/java/io/yak/ops/plugin/task/datasync/validation/JobConfigValidator.java \
                  yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync/src/main/java/io/yak/ops/plugin/task/datasync/solution/SolutionCatalog.java \
                  yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync/src/main/java/io/yak/ops/plugin/task/datasync/plan/JobPlanner.java \
                  yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync/src/test/java/io/yak/ops/plugin/task/datasync/DataSyncProductParametersTest.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(java): apply repository Spotless to keyless changes'
          git push origin HEAD:feat/keyless-cdc-e2e-product-enablement
