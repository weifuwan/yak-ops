spring:
  profiles:
    active: h2
  sql:
    init:
      schema-locations: classpath:sql/yak-ops_h2.sql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:yak-ops;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=true;
    username: sa
    password: ""

mybatis-plus:
  mapper-locations: classpath:io/yak/ops/dao/mapper/*Mapper.xml
  type-aliases-package: io.yak.ops.dao.entity
  configuration:
    cache-enabled: false
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  global-config:
    db-config:
      id-type: auto
    banner: false