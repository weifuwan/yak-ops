server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: yak-ops
  # Yak Security 保留独立数据源；Yak Ops 业务模块统一复用 yak.database。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  # 各业务模块继续维护独立 Flyway 历史表，但共享同一个业务数据源。
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${YAK_RESOURCE_MAX_FILE_SIZE:100MB}
      max-request-size: ${YAK_RESOURCE_MAX_REQUEST_SIZE:110MB}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  quartz:
    auto-startup: true
    job-store-type: memory

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: ASC
    operations-sorter: alpha
    tags-sorter: alpha

yak:
  # 数据库连接参数统一定义于此；yak.security.datasource 默认复用本节值。
  # 可通过 YAK_DATABASE_* 覆盖本节，或通过 YAK_SECURITY_DATASOURCE_* 单独覆盖安全数据源。
  # 快捷方式：设置 YAK_DATASOURCE_URL/USERNAME/PASSWORD 同时作用于两者。
  database:
    enabled: ${YAK_DATABASE_ENABLED:true}
    url: ${YAK_DATABASE_URL:${YAK_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/yak_security?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}}
    username: ${YAK_DATABASE_USERNAME:${YAK_DATASOURCE_USERNAME:root}}
    password: ${YAK_DATABASE_PASSWORD:${YAK_DATASOURCE_PASSWORD:123456}}
    driver-class-name: ${YAK_DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
    minimum-idle: ${YAK_DATABASE_MINIMUM_IDLE:1}
    maximum-pool-size: ${YAK_DATABASE_MAXIMUM_POOL_SIZE:8}

  security:
    enabled: true
    database-enabled: true
    web-enabled: true
    authentication-enabled: true
    application-name: ${YAK_SECURITY_APPLICATION_NAME:${spring.application.name}}
    authentication:
      # HttpSession 无操作超时。
      idle-timeout: ${YAK_SECURITY_AUTHENTICATION_IDLE_TIMEOUT:30m}
    public-paths:
      - /api/test/ping
      - /yak-security/api/v1/account/login
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
    permission-registration:
      enabled: true
    bootstrap:
      enabled: true
      username: ${YAK_SECURITY_BOOTSTRAP_USERNAME:root}
      password: ${YAK_SECURITY_BOOTSTRAP_PASSWORD:Root@123456}
      real-name: ${YAK_SECURITY_BOOTSTRAP_REAL_NAME:系统管理员}
    datasource:
      enabled: true
      # 连接参数默认复用 yak.database；可通过 YAK_SECURITY_DATASOURCE_* 环境变量单独覆盖（如需指向不同库）。
      url: ${YAK_SECURITY_DATASOURCE_URL:${yak.database.url}}
      username: ${YAK_SECURITY_DATASOURCE_USERNAME:${yak.database.username}}
      password: ${YAK_SECURITY_DATASOURCE_PASSWORD:${yak.database.password}}
      driver-class-name: ${yak.database.driver-class-name}
      initial-size: 1
      min-idle: 1
      max-active: 8
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  datasource:
    enabled: true
    connection-test:
      timeout-seconds: ${YAK_DATASOURCE_CONNECT_TIMEOUT_SECONDS:5}

  resource:
    enabled: ${YAK_RESOURCE_ENABLED:true}
    max-file-size: ${YAK_RESOURCE_MAX_FILE_BYTES:104857600}
    editable-max-bytes: ${YAK_RESOURCE_EDITABLE_MAX_BYTES:2097152}
    storage:
      type: ${YAK_RESOURCE_STORAGE_TYPE:LOCAL}
      local:
        enabled: ${YAK_RESOURCE_LOCAL_ENABLED:true}
        base-directory: ${YAK_RESOURCE_LOCAL_BASE_DIRECTORY:./data/resources}
        checksum-enabled: ${YAK_RESOURCE_LOCAL_CHECKSUM_ENABLED:true}
      minio:
        enabled: ${YAK_RESOURCE_MINIO_ENABLED:true}
        endpoint: ${YAK_RESOURCE_MINIO_ENDPOINT:http://127.0.0.1:9000}
        access-key: ${YAK_RESOURCE_MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${YAK_RESOURCE_MINIO_SECRET_KEY:minioadmin}
        bucket: ${YAK_RESOURCE_MINIO_BUCKET:yak-ops}
        base-prefix: ${YAK_RESOURCE_MINIO_BASE_PREFIX:resources}
        auto-create-bucket: ${YAK_RESOURCE_MINIO_AUTO_CREATE_BUCKET:true}
      hdfs:
        enabled: ${YAK_RESOURCE_HDFS_ENABLED:false}
        uri: ${YAK_RESOURCE_HDFS_URI:hdfs://127.0.0.1:9000}
        user: ${YAK_RESOURCE_HDFS_USER:hdfs}
        base-directory: ${YAK_RESOURCE_HDFS_BASE_DIRECTORY:/yak-ops/resources}
        replication: ${YAK_RESOURCE_HDFS_REPLICATION:1}

  sync:
    realtime:
      enabled: ${YAK_REALTIME_SYNC_ENABLED:true}
      rest-url: ${YAK_FLINK_REST_URL:http://127.0.0.1:8081}
      flink-home: ${YAK_FLINK_HOME:/opt/flink}
      flink-cdc-home: ${YAK_FLINK_CDC_HOME:/opt/flink-cdc}
      java-home: ${YAK_FLINK_JAVA_HOME:}
      work-directory: ${YAK_REALTIME_WORK_DIRECTORY:./data/realtime-sync}
      flink-version: ${YAK_FLINK_VERSION:1.20.5}
      flink-cdc-version: ${YAK_FLINK_CDC_VERSION:3.6.0}
      connect-timeout: ${YAK_REALTIME_CONNECT_TIMEOUT:3s}
      request-timeout: ${YAK_REALTIME_REQUEST_TIMEOUT:30s}
      submit-timeout: ${YAK_REALTIME_SUBMIT_TIMEOUT:60s}
      reconcile-delay: ${YAK_REALTIME_RECONCILE_DELAY:10000}
      reconcile-failure-threshold: ${YAK_REALTIME_RECONCILE_FAILURE_THRESHOLD:3}
      reconcile-lease-seconds: ${YAK_REALTIME_RECONCILE_LEASE_SECONDS:30}

    offline:
      enabled: ${YAK_OFFLINE_SYNC_ENABLED:true}
      engine:
        enabled: ${YAK_LINK_UP_ENABLED:true}
        base-url: ${YAK_LINK_UP_BASE_URL:http://127.0.0.1:18080}
        connect-timeout: ${YAK_LINK_UP_CONNECT_TIMEOUT:10s}
        request-timeout: ${YAK_LINK_UP_REQUEST_TIMEOUT:30s}

  schedule:
    enabled: true
    engine: quartz
    web-enabled: false

logging:
  level:
    root: INFO
    io.yak.ops: INFO
    io.yak.framework.security: DEBUG
    org.flywaydb: INFO
