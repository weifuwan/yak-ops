name: One-time Yak Ops rename compilation

on:
  push:
    paths:
      - '.github/workflows/check-yak-ops-rename-once.yml'

permissions:
  contents: read

jobs:
  tools-compile:
    name: Tools and DAO test compilation (JDK 11)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Check renamed SQL and formatting resources
        run: |
          test -f yak-ops-dao/src/main/resources/sql/yak-ops_h2.sql
          test -f yak-ops-dao/src/main/resources/sql/yak-ops_mysql.sql
          test -f yak-ops-dao/src/main/resources/sql/yak-ops_postgresql.sql
          test -f style/spotless_yak-ops_formatter.xml
          grep -Fq 'sql/yak-ops_%s.sql' yak-ops-tools/src/main/java/io/yak/ops/tools/datasource/SchemaDao.java
      - name: Compile Tools, DAO and test sources
        run: |
          bash mvnw -B -ntp -pl :yak-ops-tools -am -DskipTests \
            -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test-compile

  scheduler-compile:
    name: Backend and standalone compilation (JDK 11)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Compile scheduler and standalone modules
        run: |
          bash mvnw -B -ntp -pl :yak-ops-standalone-server -am \
            -Dmaven.test.skip=true -Dspotless.skip=true \
            -Djacoco.skip=true -Danalyze.skip=true compile
