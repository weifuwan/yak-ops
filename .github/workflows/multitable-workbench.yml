name: Multi-table patch build
on:
  push:
    branches: [work/multitable-reliability-build-20261015]
permissions:
  contents: write
concurrency:
  group: multitable-reliability-workbench
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply metadata and engine isolation fixes
        run: |
          cp .github/backfill-finalize.py /tmp/backfill-finalize.py
          git checkout -B fix/multitable-reliability-20261015 ca15dfc0ddbf7b6eecbd6b611048ae6493a8b3c1
          python3 /tmp/backfill-finalize.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/source/debezium/MySqlBinlogEngine.java')
          s=p.read_text()
          old='properties.setProperty("database.server.id", Integer.toString(serverId));'
          assert old in s
          s=s.replace(old,old+'\n        // Snapshot readers share a logical source but must own distinct JMX registrations.\n        properties.setProperty("custom.metric.tags", "reader=" + serverId);')
          p.write_text(s)
          PY
          git ls-files --modified --others --exclude-standard > /tmp/multitable-changed.txt
      - name: Format changed Java sources
        run: |
          bash mvnw -B -ntp -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply > /tmp/format.log 2>&1 || { tail -100 /tmp/format.log; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected=set(Path('/tmp/multitable-changed.txt').read_text().splitlines())
          for name in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines():
              if name not in expected: subprocess.run(['git','restore','--',name],check=True)
          PY
      - name: Commit implementation to existing PR
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yak-flow yak-ops-plugins docs/yoips/YOIP-6-mysql-chunk-backfill-checkpoints.md
          git commit -m 'fix(cdc): isolate reader metrics and validate durable handoff metadata'
          git push origin HEAD:refs/heads/fix/multitable-reliability-20261015
          echo "Implementation commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Connector and data-sync unit tests
        run: |
          bash mvnw -B -ntp -pl yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync -am test > /tmp/unit.log 2>&1 || { tail -140 /tmp/unit.log; exit 1; }
          grep -E 'Tests run:|BUILD SUCCESS' /tmp/unit.log | tail -20
      - name: MySQL chunk backfill and recovery integration tests
        run: |
          bash scripts/tests/run.sh cdc > /tmp/cdc.log 2>&1 || { tail -220 /tmp/cdc.log; exit 1; }
          cat target/test-artifacts/result.json
          mkdir -p /tmp/backfill-evidence/cdc
          cp -R target/test-artifacts/. /tmp/backfill-evidence/cdc/
          cp -R yak-flow/yak-flow-connector-cdc-mysql/target/failsafe-reports /tmp/backfill-evidence/cdc/
      - name: Real YakFlow CDC pipelines
        run: |
          bash scripts/tests/run.sh cdc-pipeline > /tmp/cdc-pipeline.log 2>&1 || { tail -220 /tmp/cdc-pipeline.log; exit 1; }
          cat target/test-artifacts/result.json
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multitable-backfill-tests
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/test-artifacts/**
            /tmp/backfill-evidence/**
            /tmp/unit.log
            /tmp/cdc.log
            /tmp/cdc-pipeline.log
          if-no-files-found: warn
          retention-days: 7
