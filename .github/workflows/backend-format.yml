name: Backend Formatting

on:
  push:
    branches: [main, dev]
    paths:
      - 'pom.xml'
      - 'yak-ops-bom/**'
      - 'style/**'
      - 'yak-ops-api/**'
      - 'yak-ops-modeling/**'
      - 'yak-ops-cdc/**'
      - '.github/workflows/backend-format.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'yak-ops-bom/**'
      - 'style/**'
      - 'yak-ops-api/**'
      - 'yak-ops-modeling/**'
      - 'yak-ops-cdc/**'
      - '.github/workflows/backend-format.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: Spotless Check (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check formatting of API, modeling and all CDC submodules
        shell: bash
        run: |
          mapfile -t modules < <(find yak-ops-cdc -type f -name pom.xml \
            | sed 's@/pom.xml$@@' | sort)
          module_csv="yak-ops-api,yak-ops-modeling,yak-ops-task-plugin/yak-ops-task-data-sync,$(IFS=,; echo "${modules[*]}")"
          # No -am: only format API, modeling and CDC; their Maven dependencies
          # do not become additional formatting targets.
          mvn -B -ntp -T 2 -pl "$module_csv" spotless:check
