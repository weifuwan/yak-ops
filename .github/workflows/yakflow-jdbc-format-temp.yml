name: Temporary YakFlow JDBC Formatter

on:
  push:
    branches:
      - refactor/yakflow-jdbc-catalog-internal-unification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Spotless configuration
        run: ./mvnw -B -ntp -pl yak-flow/yak-flow-connector-jdbc -am spotless:apply
      - name: Commit only formatted JDBC Connector files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- yak-flow/yak-flow-connector-jdbc
          if ! git diff --cached --quiet; then
            git commit -m "style(jdbc): apply repository Spotless formatting"
            git push
          fi
