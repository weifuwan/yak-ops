name: Backend Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'pom.xml'
      - 'yak-ops-alert/**'
      - 'yak-ops-api/**'
      - 'yak-ops-modeling/**'
      - 'yak-ops-modeling-ddl-core/**'
      - 'yak-ops-modeling-ddl-doris/**'
      - 'yak-ops-authentication/**'
      - 'yak-ops-bom/**'
      - 'yak-ops-common/**'
      - 'yak-ops-dao/**'
      - 'yak-ops-dao-plugin/**'
      - 'yak-ops-datasource-plugin/**'
      - 'yak-ops-eventbus/**'
      - 'yak-ops-extract/**'
      - 'yak-ops-master/**'
      - 'yak-ops-meter/**'
      - 'yak-ops-registry/**'
      - 'yak-ops-scheduler-plugin/**'
      - 'yak-ops-service/**'
      - 'yak-ops-spi/**'
      - 'yak-ops-standalone-server/**'
      - 'yak-ops-storage-plugin/**'
      - 'yak-ops-task-executor/**'
      - 'yak-ops-task-plugin/**'
      - 'yak-ops-tools/**'
      - 'yak-ops-worker/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'yak-ops-alert/**'
      - 'yak-ops-api/**'
      - 'yak-ops-modeling/**'
      - 'yak-ops-modeling-ddl-core/**'
      - 'yak-ops-modeling-ddl-doris/**'
      - 'yak-ops-authentication/**'
      - 'yak-ops-bom/**'
      - 'yak-ops-common/**'
      - 'yak-ops-dao/**'
      - 'yak-ops-dao-plugin/**'
      - 'yak-ops-datasource-plugin/**'
      - 'yak-ops-eventbus/**'
      - 'yak-ops-extract/**'
      - 'yak-ops-master/**'
      - 'yak-ops-meter/**'
      - 'yak-ops-registry/**'
      - 'yak-ops-scheduler-plugin/**'
      - 'yak-ops-service/**'
      - 'yak-ops-spi/**'
      - 'yak-ops-standalone-server/**'
      - 'yak-ops-storage-plugin/**'
      - 'yak-ops-task-executor/**'
      - 'yak-ops-task-plugin/**'
      - 'yak-ops-tools/**'
      - 'yak-ops-worker/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Show Maven version
        run: mvn --version
      - name: Compile API dependencies and execute API tests only (parallel reactor)
        shell: bash
        run: |
          # -am builds API upstream dependencies, but Surefire only selects tests
          # under io.yak.ops.api. Other backend modules are not test targets.
          # The hosted runner already has Maven; using mvn avoids wrapper JAR
          # downloads (which can fail with Maven Central HTTP 429).
          mvn -B -ntp -T 2 -pl :yak-ops-api -am \
            '-Dtest=%regex[io/yak/ops/api/.*Test.*]' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DexcludedGroups=slow \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true \
            test
      - name: Require executed API tests and no unrelated backend tests
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          reports = list(Path('yak-ops-api/target/surefire-reports').glob('TEST-*.xml'))
          total = sum(int(ET.parse(report).getroot().attrib.get('tests', 0)) for report in reports)
          print(f'API reports: {len(reports)}, tests: {total}')
          if total == 0:
              raise SystemExit('No yak-ops-api tests executed')

          unrelated = [
              report for report in Path('.').glob('yak-ops-*/**/target/surefire-reports/TEST-*.xml')
              if not str(report).startswith('yak-ops-api/')
          ]
          if unrelated:
              raise SystemExit(f'Unexpected test execution outside API: {unrelated[:5]}')
          PY
      - name: Upload API test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: yak-ops-api/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

  dao-mapper:
    name: DAO Mapper Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run DAO mapper regression tests with the H2 test database
        shell: bash
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-dao -am \
            '-Dtest=TaskInstanceMapperTest,PluginDefineTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true \
            test
      - name: Require DAO mapper regression tests to execute successfully
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          reports = {
              'TaskInstanceMapperTest': Path(
                  'yak-ops-dao/target/surefire-reports/'
                  'TEST-io.yak.ops.dao.mapper.TaskInstanceMapperTest.xml'
              ),
              'PluginDefineTest': Path(
                  'yak-ops-dao/target/surefire-reports/'
                  'TEST-io.yak.ops.dao.mapper.PluginDefineTest.xml'
              ),
          }
          for name, report in reports.items():
              if not report.exists():
                  raise SystemExit(f'Missing DAO mapper test report: {report}')

              result = ET.parse(report).getroot()
              tests = int(result.attrib.get('tests', 0))
              failures = int(result.attrib.get('failures', 0))
              errors = int(result.attrib.get('errors', 0))
              skipped = int(result.attrib.get('skipped', 0))
              print(
                  f'{name}: tests={tests}, failures={failures}, '
                  f'errors={errors}, skipped={skipped}'
              )
              if tests == 0:
                  raise SystemExit(f'{name} did not execute')
              if failures or errors:
                  raise SystemExit(f'{name} reported failures or errors')
          PY

  data-sync-plugin:
    name: Data Sync Plugin Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check if Data Sync plugin changed
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(yak-ops-task-plugin/yak-ops-task-data-sync/|yak-ops-datasource-plugin/yak-ops-datasource-api/|pom.xml$|yak-ops-bom/)'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Data Sync plugin unit tests
        if: steps.changed.outputs.run_tests == 'true'
        shell: bash
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-task-data-sync -am \
            '-Dtest=DataSyncParametersTest,DataSyncPipelineBuilderTest,DataSyncJobRunnerTest,MiniClusterDataSyncExecutionServiceTest,DataSyncExecutionCoordinatorTest,AbstractDataSyncMetricsServiceTest,FlinkRestDataSyncMetricsServiceTest,RpcDataSyncReportPublisherTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
      - name: Require executed Data Sync plugin tests
        if: steps.changed.outputs.run_tests == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          reports = list(Path('yak-ops-task-plugin/yak-ops-task-data-sync/target/surefire-reports').glob('TEST-*.xml'))
          total = sum(int(ET.parse(report).getroot().attrib.get('tests', 0)) for report in reports)
          print(f'Data Sync test reports: {len(reports)}, tests: {total}')
          if total == 0:
              raise SystemExit('No Data Sync plugin unit tests executed')
          PY

  data-sync-report-service:
    name: Data Sync Report Service Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Data Sync report service tests
        shell: bash
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-service -am \
            '-Dtest=DataSyncExecutionReportServiceImplTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
      - name: Compile Master RPC report listener
        shell: bash
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-master -am \
            -DskipTests -DskipUT=true -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true compile
      - name: Require Data Sync report service tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          reports = list(Path('yak-ops-service/target/surefire-reports').glob(
              'TEST-io.yak.ops.service.datasync.impl.DataSyncExecutionReportServiceImplTest.xml'
          ))
          if not reports:
              raise SystemExit('Missing DataSyncExecutionReportServiceImplTest report')
          result = ET.parse(reports[0]).getroot()
          tests = int(result.attrib.get('tests', 0))
          failures = int(result.attrib.get('failures', 0))
          errors = int(result.attrib.get('errors', 0))
          print(f'DataSyncExecutionReportServiceImplTest: tests={tests}, failures={failures}, errors={errors}')
          if tests == 0 or failures or errors:
              raise SystemExit('Data Sync report service tests did not pass')
          PY

  data-sync-api:
    name: Data Sync API Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Data Sync API service tests
        shell: bash
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-api -am \
            '-Dtest=DataSyncServiceImplTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
      - name: Require Data Sync API test report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          reports = list(Path('yak-ops-api/target/surefire-reports').glob(
              'TEST-io.yak.ops.api.service.impl.DataSyncServiceImplTest.xml'
          ))
          if not reports:
              raise SystemExit('Missing DataSyncServiceImplTest report')
          result = ET.parse(reports[0]).getroot()
          tests = int(result.attrib.get('tests', 0))
          failures = int(result.attrib.get('failures', 0))
          errors = int(result.attrib.get('errors', 0))
          print(f'DataSyncServiceImplTest: tests={tests}, failures={failures}, errors={errors}')
          if tests == 0 or failures or errors:
              raise SystemExit('Data Sync API tests did not pass')
          PY

  datasource-catalog-plugin:
    name: Datasource Catalog Plugin Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile MySQL and PostgreSQL catalog plugins and run catalog tests
        shell: bash
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-datasource-mysql,:yak-ops-datasource-postgresql -am \
            '-Dtest=MySQLDataSourceCatalogTest,PostgreSQLDataSourceCatalogTest' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
      - name: Require catalog plugin tests to execute
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          modules = [
              Path('yak-ops-datasource-plugin/yak-ops-datasource-mysql/target/surefire-reports'),
              Path('yak-ops-datasource-plugin/yak-ops-datasource-postgresql/target/surefire-reports'),
          ]
          for module in modules:
              reports = list(module.glob('TEST-*.xml'))
              total = sum(int(ET.parse(report).getroot().attrib.get('tests', 0)) for report in reports)
              print(f'{module}: {len(reports)} reports, {total} tests')
              if total == 0:
                  raise SystemExit(f'No catalog plugin tests executed in {module}')
          PY

  modeling-unit:
    name: Modeling Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile modeling dependencies and execute modeling tests
        shell: bash
        run: |
          mvn -B -ntp -T 2 -pl :yak-ops-modeling -am \
            '-Dtest=%regex[io/yak/ops/modeling/.*Test.*]' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DexcludedGroups=slow \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true \
            test
      - name: Require executed modeling tests
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          reports = list(Path('yak-ops-modeling/target/surefire-reports').glob('TEST-*.xml'))
          total = sum(int(ET.parse(report).getroot().attrib.get('tests', 0)) for report in reports)
          print(f'Modeling test reports: {len(reports)}, tests: {total}')
          if total == 0:
              raise SystemExit('No yak-ops-modeling unit tests executed')
          PY
      - name: Upload modeling test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modeling-test-reports
          path: yak-ops-modeling/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7
