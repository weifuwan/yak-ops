name: One-time Yak Ops identifier rebrand

on:
  push:
    paths:
      - '.github/workflows/rebrand-yak-ops-once.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - name: Validate script and audit
        run: |
          python3 -m py_compile scripts/rebrand_yak_ops.py
          python3 scripts/rebrand_yak_ops.py --audit
      - name: Rebrand active files and rename tracked paths
        run: |
          python3 scripts/rebrand_yak_ops.py --apply
          python3 scripts/rebrand_yak_ops.py --verify
          git diff --check
          git status --short | tail -n 55
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rebrand remaining DolphinScheduler identifiers to Yak Ops'
          git push origin HEAD:main
