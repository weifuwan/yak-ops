name: Temporary Format Data Sync Branch
on:
  push:
    branches:
      - refactor/core-data-sync-client-v5
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Spotless formatting
        run: |
          bash mvnw -DskipTests -pl yak-ops-core,yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync,yak-ops-boot com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Export formatted files for GitHub client
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,base64,pathlib
          names=subprocess.check_output(["git","diff","--name-only","--","*.java"],text=True).splitlines()
          for name in names:
              print("__FORMATTED_FILE_START__ "+name)
              print(base64.b64encode(pathlib.Path(name).read_bytes()).decode("ascii"))
              print("__FORMATTED_FILE_END__")
          print("__FORMATTED_COUNT__ "+str(len(names)))
          PY
