name: YOIP-4 Implementation Workbench
on:
  push:
    branches: [feat/yoip-4-schedule-definition-foundation]
permissions:
  contents: read
concurrency:
  group: yoip4-foundation-workbench
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          parts = [Path(f'.github/yoip4-patch-{index}.b64') for index in range(1, 5)]
          encoded = ''.join(path.read_text().strip() for path in parts)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != 'fe7a84f440c5916689ff62a77c8e2577a62e5b372844d3692fbec8eb825df76d':
              raise SystemExit('Implementation patch checksum mismatch')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          for path in parts:
              path.unlink()
          Path('.github/workflows/yoip4-workbench.yml').unlink()
          PY
          git add -u
      - name: Format touched Java sources and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from xml.sax.saxutils import escape
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=ACMR'], text=True).splitlines()
          includes = ''.join('<include>' + escape(path) + '</include>' for path in paths if path.endswith('.java'))
          pom = '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>io.yak.ops</groupId><artifactId>temporary-format</artifactId><version>1</version><build><plugins><plugin><groupId>com.diffplug.spotless</groupId><artifactId>spotless-maven-plugin</artifactId><version>3.10.2</version><configuration><java><includes>' + includes + '</includes><removeUnusedImports/><forbidWildcardImports/><palantirJavaFormat><version>2.97.0</version><style>PALANTIR</style><formatJavadoc>false</formatJavadoc></palantirJavaFormat><trimTrailingWhitespace/><endWithNewline/></java></configuration></plugin></plugins></build></project>'
          Path('.yoip4-formatter.xml').write_text(pom)
          PY
          bash mvnw -B -ntp -f .yoip4-formatter.xml com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          rm .yoip4-formatter.xml
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(schedule): implement definition persistence, Quartz preview and task eligibility'
          git push origin HEAD:feat/yoip-4-schedule-definition-foundation
      - name: Verify logging and backend
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_logging_rules.py
          python3 scripts/verify_logging_rules.py
          python3 -m py_compile scripts/acceptance/task-execution-e2e.py
          bash mvnw -B -ntp -pl '!yak-ops-ui,!yak-ops-dist' verify 2>&1 | tee /tmp/yoip4-backend.log
      - name: Export implementation evidence
        if: always()
        run: |
          mkdir -p /tmp/yoip4-review
          git archive --format=tar HEAD -o /tmp/yoip4-review/head.tar
          git rev-parse HEAD > /tmp/yoip4-review/revision.txt
          git diff > /tmp/yoip4-review/uncommitted.diff
          test ! -f /tmp/yoip4-backend.log || cp /tmp/yoip4-backend.log /tmp/yoip4-review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yoip4-implementation-evidence
          path: |
            /tmp/yoip4-review/
            **/target/surefire-reports/**
          retention-days: 2
