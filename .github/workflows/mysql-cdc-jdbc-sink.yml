name: MySQL CDC JDBC Sink Verification

on:
  pull_request:
    paths:
      - 'yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-jdbc-parent/**'
      - 'yak-ops-cdc/yak-ops-cdc-composer/**'
      - '.github/workflows/mysql-cdc-jdbc-sink.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jdbc-sink:
    name: Compile and test JDBC Sink
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile JDBC Pipeline Sink and its dependencies
        run: bash mvnw -B -ntp -pl yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-jdbc-parent/yak-ops-cdc-pipeline-connector-jdbc -am -Dmaven.test.skip=true compile
      - name: Run JDBC Core and MySQL dialect unit tests
        run: >
          bash mvnw -B -ntp
          -pl yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-jdbc-parent/yak-ops-cdc-pipeline-connector-jdbc-core,yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-jdbc-parent/yak-ops-cdc-pipeline-connector-jdbc-mysql
          -am -DskipITs test
