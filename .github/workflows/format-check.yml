name: Code Format

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-format:
    name: UI Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yak-ops-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check

  cdc-format:
    name: CDC Java Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check CDC formatting
        run: bash mvnw -B -ntp -pl '!yak-ops-ui' com.diffplug.spotless:spotless-maven-plugin:3.10.2:check
