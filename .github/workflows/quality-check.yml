name: Quality Check

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A single scope classifier runs in existing jobs, not in an extra Actions job.
# Reusable Release Gate invocations are deliberately treated as full-quality runs.
env:
  CI_EVENT_NAME: ${{ github.event_name }}
  CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
  CI_CURRENT_SHA: ${{ github.sha }}

concurrency:
  group: quality-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect CI scope
        id: scope
        run: bash scripts/ci/detect-changes.sh

      - name: Verify CI scope and backend boundaries
        if: steps.scope.outputs.backend == 'true'
        run: |
          bash scripts/ci/test-detect-changes.sh
          bash scripts/ci/verify-backend-boundaries.sh

      - name: Setup Java
        if: steps.scope.outputs.backend == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Release tooling syntax
        if: steps.scope.outputs.backend == 'true'
        run: bash -n scripts/release/*.sh

      - name: Release metadata consistency
        if: steps.scope.outputs.backend == 'true'
        run: bash scripts/release/check-release-metadata.sh

      - name: Backend logging rules
        if: steps.scope.outputs.backend == 'true'
        run: python3 scripts/verify_logging_rules.py

      - name: Backend format
        if: steps.scope.outputs.backend == 'true'
        run: >-
          bash mvnw -q -DskipTests
          -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist'
          com.diffplug.spotless:spotless-maven-plugin:3.10.2:check

      - name: Backend verify
        if: steps.scope.outputs.backend == 'true'
        run: >-
          bash mvnw -q
          -pl '!yak-ops-ui,!yak-ops-dist'
          verify

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yak-ops-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect CI scope
        id: scope
        run: bash ../scripts/ci/detect-changes.sh

      - name: Setup Node
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.frontend == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Frontend format
        if: steps.scope.outputs.frontend == 'true'
        run: npm run format:check

      - name: Frontend lint
        if: steps.scope.outputs.frontend == 'true'
        run: npm run lint

      - name: Frontend type check
        if: steps.scope.outputs.frontend == 'true'
        run: npm run typecheck

      - name: Frontend architecture
        if: steps.scope.outputs.frontend == 'true'
        run: npm run architecture:check

      - name: Frontend build
        if: steps.scope.outputs.frontend == 'true'
        run: npm run build


  distribution-quality:
    name: Distribution Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect CI scope
        id: changes
        run: bash scripts/ci/detect-changes.sh

      - name: Setup Java
        if: steps.changes.outputs.distribution == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        if: steps.changes.outputs.distribution == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.distribution == 'true'
        working-directory: yak-ops-ui
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend distribution
        if: steps.changes.outputs.distribution == 'true'
        working-directory: yak-ops-ui
        run: npm run build

      - name: Build Yak Ops distribution
        if: steps.changes.outputs.distribution == 'true'
        run: bash mvnw -B -ntp -DskipTests package

      - name: Verify Yak Ops distribution
        if: steps.changes.outputs.distribution == 'true'
        run: bash scripts/release/verify-distribution.sh

  # Stable required status: the three quality jobs must ALL succeed. Do not treat a
  # skipped, cancelled, or missing check as a pass. This job runs after failures.
  pr-required-checks:
    name: PR Required Checks
    if: ${{ always() }}
    needs:
      - backend-quality
      - frontend-quality
      - distribution-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all quality jobs
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution-quality.result }}
        run: |
          set -euo pipefail

          echo "## PR Required Checks" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Quality job | Result |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| --- | --- |" >> "${GITHUB_STEP_SUMMARY}"

          failed=0
          checks=(
            "Backend Quality:${BACKEND_RESULT}"
            "Frontend Quality:${FRONTEND_RESULT}"
            "Distribution Quality:${DISTRIBUTION_RESULT}"
          )
          for check in "${checks[@]}"; do
            name="${check%%:*}"
            result="${check#*:}"
            echo "| ${name} | ${result} |" >> "${GITHUB_STEP_SUMMARY}"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${name} was ${result}; all quality jobs must succeed."
              failed=1
            fi
          done

          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "This gate covers code quality, not JDBC/CDC runtime E2E acceptance." >> "${GITHUB_STEP_SUMMARY}"
          exit "${failed}"
