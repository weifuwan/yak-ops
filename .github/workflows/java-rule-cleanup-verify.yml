name: Java Rule Cleanup Verification

on:
  push:
    branches:
      - refactor/java-rule-violations-cleanup-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Spotless apply
        run: >-
          bash mvnw -q -DskipTests
          -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist'
          com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply

      - name: Ensure formatter is idempotent
        run: git diff --exit-code -- '*.java'

      - name: Spotless check
        run: >-
          bash mvnw -q -DskipTests
          -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist'
          com.diffplug.spotless:spotless-maven-plugin:3.10.2:check

      - name: Backend compile
        run: >-
          bash mvnw -q -DskipTests
          -pl '!yak-ops-ui,!yak-ops-dist'
          compile
