name: JDBC Sink Cross-Database Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/jdbc-sink-cross-database-acceptance.yml"
      - "yak-flow/yak-flow-connector-jdbc/**"
      - "yak-flow/yak-flow-connector-base/**"
      - "yak-flow/yak-flow-runtime/**"
      - "yak-ops-core/src/main/java/io/yak/ops/core/types/**"
      - "yak-ops-core/src/main/java/io/yak/ops/core/data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-to-postgres:
    name: MySQL to PostgreSQL Sink IT
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: yak_it
          MYSQL_USER: yak
          MYSQL_PASSWORD: yakpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yak_it
          POSTGRES_USER: yak
          POSTGRES_PASSWORD: yakpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yak -d yak_it"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Real MySQL to PostgreSQL Sink IT
        run: >
          bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-jdbc -am
          -Dtest=JdbcSinkCrossDatabaseIT -Dsurefire.failIfNoSpecifiedTests=false
          -Djdbc.it.allow-write=true
          -Djdbc.it.source.url="jdbc:mysql://127.0.0.1:3306/yak_it?useSSL=false&allowPublicKeyRetrieval=true"
          -Djdbc.it.source.user=yak -Djdbc.it.source.password=yakpass
          -Djdbc.it.target.url=jdbc:postgresql://127.0.0.1:5432/yak_it
          -Djdbc.it.target.user=yak -Djdbc.it.target.password=yakpass test

  postgres-to-oracle:
    name: PostgreSQL to Oracle Sink IT
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yak_it
          POSTGRES_USER: yak
          POSTGRES_PASSWORD: yakpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yak -d yak_it"
          --health-interval=10s --health-timeout=5s --health-retries=30
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oraclepass
          APP_USER: YAK_IT
          APP_USER_PASSWORD: yakpass
        ports:
          - 1521:1521
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=15s --health-timeout=15s --health-retries=40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Real PostgreSQL to Oracle Sink IT
        run: >
          bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-jdbc -am
          -Dtest=JdbcSinkCrossDatabaseIT -Dsurefire.failIfNoSpecifiedTests=false
          -Djdbc.it.allow-write=true
          -Djdbc.it.source.url=jdbc:postgresql://127.0.0.1:5432/yak_it
          -Djdbc.it.source.user=yak -Djdbc.it.source.password=yakpass
          -Djdbc.it.target.url=jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
          -Djdbc.it.target.user=YAK_IT -Djdbc.it.target.password=yakpass test

  oracle-to-mysql:
    name: Oracle to MySQL Sink IT
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oraclepass
          APP_USER: YAK_IT
          APP_USER_PASSWORD: yakpass
        ports:
          - 1521:1521
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=15s --health-timeout=15s --health-retries=40
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: yak_it
          MYSQL_USER: yak
          MYSQL_PASSWORD: yakpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Real Oracle to MySQL Sink IT
        run: >
          bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-jdbc -am
          -Dtest=JdbcSinkCrossDatabaseIT -Dsurefire.failIfNoSpecifiedTests=false
          -Djdbc.it.allow-write=true
          -Djdbc.it.source.url=jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
          -Djdbc.it.source.user=YAK_IT -Djdbc.it.source.password=yakpass
          -Djdbc.it.target.url="jdbc:mysql://127.0.0.1:3306/yak_it?useSSL=false&allowPublicKeyRetrieval=true"
          -Djdbc.it.target.user=yak -Djdbc.it.target.password=yakpass test
