name: Quality Baseline Format

on:
  push:
    branches:
      - chore/quality-baseline-format

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13"

      - name: Apply backend formatting
        run: >-
          bash mvnw -q -DskipTests
          -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist'
          com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply

      - name: Install frontend dependencies
        working-directory: yak-ops-ui
        run: npm install --no-audit --no-fund

      - name: Apply frontend formatting
        working-directory: yak-ops-ui
        run: npm run format

      - name: Commit baseline formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply quality baseline format"
          git push
