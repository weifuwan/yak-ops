name: Backend Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'pom.xml'
      - 'yak-ops-*/**'
      - '!yak-ops-cdc/**'
      - '!yak-ops-ui/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'yak-ops-*/**'
      - '!yak-ops-cdc/**'
      - '!yak-ops-ui/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduler-unit:
    name: Scheduler Unit Tests (JDK 11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run selected Scheduler unit tests
        run: |
          bash mvnw -B -ntp \
            -pl :yak-ops-common,:yak-ops-spi -am \
            -Dtest=DAGTest,WorkflowExecutionStatusTest,MaskUtilsTest,PluginParamsTransferTest,PrioritySPIFactoryTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test

      - name: Require real executed unit tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          for module in ('yak-ops-common', 'yak-ops-spi'):
              reports = list(Path(module, 'target', 'surefire-reports').glob('TEST-*.xml'))
              if not reports:
                  raise SystemExit(f'{module}: missing Surefire XML reports')
              totals = {'tests': 0, 'failures': 0, 'errors': 0}
              for report in reports:
                  root = ET.parse(report).getroot()
                  for key in totals:
                      totals[key] += int(root.attrib.get(key, 0))
              print(f'{module}: {totals}')
              if totals['tests'] == 0 or totals['failures'] or totals['errors']:
                  raise SystemExit(f'{module}: unit tests missing or failed')
          PY

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-unit-test-reports
          path: |
            yak-ops-common/target/surefire-reports/**
            yak-ops-spi/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7
