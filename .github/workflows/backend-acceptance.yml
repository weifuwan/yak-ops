name: Backend Acceptance (implementation pending)

on:
  workflow_call:
    inputs:
      full_sweep:
        description: Require full Data Sync acceptance for a release gate.
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: backend-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-gate:
    name: Backend Acceptance — Not Available
    runs-on: ubuntu-latest
    steps:
      - name: Report acceptance status
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_SWEEP: ${{ inputs.full_sweep }}
        run: |
          set -euo pipefail
          echo "::warning::The old JDBC, MySQL CDC and Data Sync automation implementations and E2E tests were removed. No acceptance tests have been executed."
          if [[ "${FULL_SWEEP}" == "true" || "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "schedule" ]]; then
            echo "::error::Full Backend Acceptance is unavailable until new implementations and tests exist. Formal release is blocked."
            exit 1
          fi
          echo "This check only reports acceptance unavailability; it does not claim PASS."
