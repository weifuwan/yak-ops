name: Temporary Data Sync UI Validation
on:
  pull_request:
    paths:
      - 'yak-ops-ui/**'
      - '.github/workflows/data-sync-ui-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Install dependencies
        working-directory: yak-ops-ui
        run: npm ci
      - name: TypeScript
        working-directory: yak-ops-ui
        run: npm run typecheck
      - name: Production build
        working-directory: yak-ops-ui
        run: npm run build
      - name: Data Sync contract tests
        working-directory: yak-ops-ui
        run: npm run test:data-sync
