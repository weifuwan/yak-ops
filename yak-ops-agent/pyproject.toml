[project]
name = "yak-ops-agent"
version = "0.1.0"
description = "AgentScope-based read-only copilot harness for yak-ops (replaces the retired Java agent module)."
requires-python = ">=3.11"
dependencies = [
    "agentscope==2.0.12",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yak_agent"]
