name: Data Sync PR One-Time Formatter
on:
  push:
    branches: [feature/data-sync-cdc-pipeline-mvp]
    paths: ['.github/workflows/data-sync-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'weifuwan/yak-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Format modified Java sources
        run: |
          mvn -B -ntp -pl :yak-ops-api,:yak-ops-worker,:yak-ops-task-data-sync,:yak-ops-cdc-composer spotless:apply
      - name: Commit generated formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yak-ops-api/src/main/java/io/yak/ops/api/controller/DataSyncMvpController.java
          git add yak-ops-task-plugin/yak-ops-task-data-sync/src/main/java
          git add yak-ops-worker/src/main/java/io/yak/ops/server/worker/executor/PhysicalTaskExecutor.java
          git add yak-ops-cdc/yak-ops-cdc-composer/src/main/java/org/apache/flink/cdc/composer/flink/FlinkPipelineExecution.java
          if ! git diff --cached --quiet; then
            git commit -m "style(data-sync): apply Spotless to new CDC integration"
            git push origin HEAD:feature/data-sync-cdc-pipeline-mvp
          fi
