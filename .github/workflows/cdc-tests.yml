name: CDC Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'pom.xml'
      - 'yak-ops-bom/**'
      - 'yak-ops-cdc/**'
      - '.github/workflows/cdc-tests.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'yak-ops-bom/**'
      - 'yak-ops-cdc/**'
      - '.github/workflows/cdc-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdc-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdc-unit:
    name: All CDC Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Show Maven version
        run: mvn --version
      - name: Run all CDC module tests (including test compilation)
        shell: bash
        run: |
          mapfile -t modules < <(find yak-ops-cdc -type f -name pom.xml | sed 's@/pom.xml$@@' | sort)
          module_csv=$(IFS=,; echo "${modules[*]}")
          test -n "$module_csv"
          mvn -B -ntp -T 2 -fae -pl "$module_csv" -am \
            -DskipUT=false -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test
      - name: Require executed CDC tests
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = [p for p in Path('yak-ops-cdc').rglob('TEST-*.xml') if 'surefire-reports' in p.parts]
          total = sum(int(ET.parse(p).getroot().attrib.get('tests', 0)) for p in reports)
          print(f'CDC reports: {len(reports)}, tests: {total}')
          if total == 0:
              raise SystemExit('No CDC tests executed')
          PY
      - name: Upload CDC test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-test-reports
          path: yak-ops-cdc/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7
