# Temporary branch-only formatter; removed after application.
name: Worker Format Once
on:
  push:
    branches:
      - refactor/worker-execution-alignment
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Format changed worker and task execution modules
        run: bash ./mvnw -B -pl yak-ops-worker,yak-ops-task-execution spotless:apply
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yak-ops-worker yak-ops-task-execution
          if ! git diff --cached --quiet; then
            git commit -m 'style(worker): apply repository Java format after targeted fixes'
            git push origin HEAD:refactor/worker-execution-alignment
          fi
