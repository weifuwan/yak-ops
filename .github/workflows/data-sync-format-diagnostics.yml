name: Data Sync Format Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    if: github.head_ref == 'refactor/data-sync-business-services-single-table'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Prepare formatter
        working-directory: yak-ops-ui
        run: npm ci
      - name: Print exact oxfmt diff
        run: |
          cd yak-ops-ui
          ./node_modules/.bin/oxfmt apps/web/app/data-sync/task-editor.tsx
          cd ..
          git --no-pager diff -- yak-ops-ui/apps/web/app/data-sync/task-editor.tsx
