[project]
name = "yak-ops-agent"
version = "0.1.0"
description = "AgentScope-based copilot harness for yak-ops (data-sync closed loop)."
requires-python = ">=3.11"
dependencies = [
    "agentscope==2.0.12",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    "cocoon-sandbox>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PEP 8 / Google-style engineering practices: errors, pyflakes, warnings,
# bugbear, simplification, pyupgrade, comprehensions.
select = ["E", "F", "W", "B", "SIM", "UP", "C4"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yak_agent"]
