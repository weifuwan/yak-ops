name: Temporary V5 PR formatter
on:
  push:
    branches:
      - refactor/core-data-sync-client-v5
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-data-sync-client-v5
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply repository formatting
        run: |
          cd yak-ops-ui
          npm ci --no-audit --no-fund
          npm run format
          cd ..
          bash mvnw -B -ntp -pl yak-ops-boot,yak-ops-core,yak-ops-dao,yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync spotless:apply
      - name: Commit formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(pipeline): apply Spotless and oxfmt"
            git push origin HEAD:refactor/core-data-sync-client-v5
          fi
