name: Backend Formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.java"
      - "pom.xml"
      - ".github/workflows/backend-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply formatter
        run: ./mvnw -q -DskipTests spotless:apply

      - name: Verify formatter
        run: ./mvnw -q -DskipTests spotless:check

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.java'
          git commit -m "style(java): apply backend formatter"
          git push origin HEAD:${{ github.head_ref }}
