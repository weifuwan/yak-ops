name: Multi-table patch build
on:
  push:
    branches: [work/multitable-reliability-build-20261015]
permissions:
  contents: write
concurrency:
  group: multitable-reliability-workbench
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply reviewed backfill changes
        run: |
          cp .github/backfill-*.py /tmp/
          git checkout -B fix/multitable-reliability-20261015 9ac7e64b11b387dcd5c441f55637c4bd700e04c7
          for patch in /tmp/backfill-*.py; do python3 "$patch"; done
          git ls-files --modified --others --exclude-standard > /tmp/multitable-changed.txt
      - name: Format changed Java sources
        run: |
          bash mvnw -B -ntp -DskipTests -pl '!yak-ops-bom,!yak-ops-ui,!yak-ops-dist' com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = set(Path('/tmp/multitable-changed.txt').read_text().splitlines())
          for name in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines():
              if name not in expected: subprocess.run(['git', 'restore', '--', name], check=True)
          PY
      - name: Commit implementation to existing PR
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yak-flow yak-ops-plugins
          git commit -m 'feat(cdc): connect per-chunk backfill with durable output and filtered binlog handoff'
          git push origin HEAD:refs/heads/fix/multitable-reliability-20261015
          echo "Implementation commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Connector and data-sync unit tests
        run: >-
          bash mvnw -B -ntp
          -pl yak-ops-plugins/yak-ops-plugin-task/yak-ops-plugin-task-data-sync -am test
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multitable-backfill-tests
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/test-artifacts/**
          if-no-files-found: warn
          retention-days: 7
