name: Temporary Format Diff
on:
  push:
    branches: [fix/data-sync-active-definition-edit]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Generate formatter patch
        working-directory: yak-ops-ui
        shell: bash
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx oxfmt apps/web/app/data-sync/editor/batch-mapping-dialog.tsx apps/web/app/data-sync/editor/index.tsx apps/web/app/data-sync/editor/replication-mapping-table.tsx apps/web/app/data-sync/editor/target-structure-editor-dialog.tsx scripts/verify-data-sync-list.mjs
          echo 'FORMAT_PATCH_START'
          git diff -- apps/web/app/data-sync/editor/batch-mapping-dialog.tsx apps/web/app/data-sync/editor/index.tsx apps/web/app/data-sync/editor/replication-mapping-table.tsx apps/web/app/data-sync/editor/target-structure-editor-dialog.tsx scripts/verify-data-sync-list.mjs
          echo 'FORMAT_PATCH_END'
      - name: Verify Data Sync list contract
        working-directory: yak-ops-ui
        run: node --experimental-strip-types scripts/verify-data-sync-list.mjs
