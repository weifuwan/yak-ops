name: Data Sync PR Validation
on:
  push:
    branches: [feature/data-sync-cdc-pipeline-mvp]
    paths:
      - '.github/workflows/data-sync-pr-validation.yml'
      - 'yak-ops-ui/**'
      - 'yak-ops-api/**'
      - 'yak-ops-task-plugin/yak-ops-task-data-sync/**'
      - 'yak-ops-dao/**'
permissions:
  contents: write
concurrency:
  group: data-sync-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: TypeScript and frontend format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yak-ops-ui/package-lock.json
      - name: Install dependencies
        working-directory: yak-ops-ui
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        working-directory: yak-ops-ui
        run: npm run typecheck
      - name: Check formatting
        working-directory: yak-ops-ui
        run: npm run format:check
  format-java:
    name: Apply Java formatting once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply Spotless
        run: mvn -B -ntp -pl :yak-ops-api,:yak-ops-dao,:yak-ops-task-data-sync spotless:apply
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yak-ops-api/src/main/java/io/yak/ops/api/ yak-ops-dao/src/main/java/io/yak/ops/dao/ yak-ops-task-plugin/yak-ops-task-data-sync/src/main/java/
          if ! git diff --cached --quiet; then
            git commit -m "style(data-sync): apply Java formatting"
            git push origin HEAD:feature/data-sync-cdc-pipeline-mvp
          fi
