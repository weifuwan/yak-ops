name: Temporary MySQL CDC Config Spotless Apply (final)
on:
  push:
    branches:
      - feat/mysql-cdc-configuration-contract
    paths:
      - .github/workflows/temporary-mysql-cdc-config-spotless.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'weifuwan/yak-ops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: feat/mysql-cdc-configuration-contract
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply repository Java formatting
        run: bash mvnw -B -ntp -pl yak-flow/yak-flow-connector-cdc-mysql com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
      - name: Commit only changed MySQL CDC configuration files
        run: |
          set -euo pipefail
          git add \
            yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/source/config/MySqlSourceConfig.java \
            yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/source/config/MySqlSourceConfigFactory.java \
            yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/source/config/MySqlSourceOptions.java \
            yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/table/MySqlCdcSourceFactory.java \
            yak-flow/yak-flow-connector-cdc-mysql/src/main/java/io/yak/ops/connector/cdc/mysql/debezium/reader/SnapshotSplitReader.java \
            yak-flow/yak-flow-connector-cdc-mysql/src/test/java/io/yak/ops/connector/cdc/mysql/source/config/MySqlSourceConfigTest.java \
            yak-flow/yak-flow-connector-cdc-mysql/src/test/java/io/yak/ops/connector/cdc/mysql/source/enumerator/MySqlSourceEnumeratorTest.java
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(cdc): apply repository Java format to configuration contract'
            git push origin HEAD:refs/heads/feat/mysql-cdc-configuration-contract
          fi
