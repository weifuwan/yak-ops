name: Backend Formatter

on:
  push:
    branches:
      - style/backend-mechanical-cleanup-run

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply formatter
        shell: bash
        run: |
          while IFS= read -r source_dir; do
            module="${source_dir%/src/main/java}"
            echo "Formatting ${module}"
            bash mvnw -q -f "${module}/pom.xml" -DskipTests com.diffplug.spotless:spotless-maven-plugin:3.10.2:apply
          done < <(find . -type d -path "*/src/main/java" -not -path "./yak-ops-ui/*" | sort)

      - name: Verify formatter
        shell: bash
        run: |
          while IFS= read -r source_dir; do
            module="${source_dir%/src/main/java}"
            echo "Checking ${module}"
            bash mvnw -q -f "${module}/pom.xml" -DskipTests com.diffplug.spotless:spotless-maven-plugin:3.10.2:check
          done < <(find . -type d -path "*/src/main/java" -not -path "./yak-ops-ui/*" | sort)

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.java'
          git commit -m "style(java): apply backend formatter"
          git push origin HEAD:${{ github.ref_name }}
