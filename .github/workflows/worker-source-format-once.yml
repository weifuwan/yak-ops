# Temporary on-branch formatter; removed after it commits the edits.
name: Worker Source Format Once
on:
  push:
    branches:
      - refactor/worker-execution-alignment
permissions:
  contents: write
jobs:
  apply-formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply project Spotless rules
        run: bash ./mvnw -B -pl yak-ops-worker,yak-ops-task-execution spotless:apply
      - name: Commit Java formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yak-ops-worker yak-ops-task-execution
          if ! git diff --cached --quiet; then
            git commit -m 'style(worker): format source-aligned DolphinScheduler classes'
            git push origin HEAD:refactor/worker-execution-alignment
          fi
