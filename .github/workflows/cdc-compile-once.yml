name: CDC Compile (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Build CDC CLI, MySQL source and JDBC sink
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package retained CDC modules without tests
        run: |
          bash mvnw -B -ntp \
            -pl :yak-ops-cdc-cli,:yak-ops-cdc-pipeline-connector-mysql,:yak-ops-cdc-pipeline-connector-jdbc \
            -am -DskipTests -Dspotless.check.skip=true package
