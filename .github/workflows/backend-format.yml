name: Backend Formatting

on:
  push:
    branches: [main, dev]
    paths:
      - 'pom.xml'
      - 'style/**'
      - 'yak-ops-*/**'
      - '!yak-ops-ui/**'
      - '.github/workflows/backend-format.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'style/**'
      - 'yak-ops-*/**'
      - '!yak-ops-ui/**'
      - '.github/workflows/backend-format.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: Spotless Check (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check all backend formatting without modifying files
        shell: bash
        run: bash mvnw -B -ntp -fae spotless:check
