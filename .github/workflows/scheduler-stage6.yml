name: Scheduler Stage 6 Verification

on:
  push:
    branches: [main]
    paths:
      - 'yak-ops-*/**'
      - '!yak-ops-cdc/**'
      - '!yak-ops-ui/**'
      - '.github/workflows/scheduler-stage6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-stage6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-unit:
    name: EventBus unit tests (JDK 11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run EventBus tests
        run: bash mvnw -B -ntp -f pom.xml -pl :yak-ops-eventbus -am -Dspotless.skip=true -Djacoco.skip=true -Danalyze.skip=true test

  full-compile:
    name: Compile all imported Scheduler modules (JDK 11)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Compile full selected upstream reactor
        run: bash scripts/compile-scheduler.sh
