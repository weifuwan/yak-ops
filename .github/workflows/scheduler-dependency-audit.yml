name: Scheduler Stage 6 Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stax:
    name: Trace legacy StAX runtime dependency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Identify the transitive stax-api source
        run: |
          bash mvnw -B -ntp -f pom.xml \
            -pl :yak-ops-standalone-server -am \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:tree \
            -Dverbose -Dincludes=stax:stax-api
