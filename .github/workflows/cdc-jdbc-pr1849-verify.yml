name: CDC JDBC PR1849 One-off Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-jdbc-parent/**'
      - '.github/workflows/cdc-jdbc-pr1849-verify.yml'
  push:
    branches:
      - refactor/cdc-jdbc-writer-architecture-20261104
    paths:
      - 'yak-ops-cdc/yak-ops-cdc-connect/yak-ops-cdc-pipeline-connectors/yak-ops-cdc-pipeline-connector-jdbc-parent/**'
      - '.github/workflows/cdc-jdbc-pr1849-verify.yml'

permissions:
  contents: read

jobs:
  jdbc-compile-and-tests:
    name: CDC JDBC Compile and Targeted Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile JDBC connector reactor
        run: |
          bash mvnw -B -ntp -f yak-ops-cdc/pom.xml \
            -pl :yak-ops-cdc-pipeline-connector-jdbc-core,:yak-ops-cdc-pipeline-connector-jdbc-mysql \
            -am -DskipTests compile
      - name: Run focused CDC JDBC regression tests
        run: |
          bash mvnw -B -ntp -f yak-ops-cdc/pom.xml \
            -pl :yak-ops-cdc-pipeline-connector-jdbc-core,:yak-ops-cdc-pipeline-connector-jdbc-mysql \
            -am \
            -Dtest=RichJdbcOutputFormatLifecycleTest,JdbcOutputFormatBuilderTest,JdbcTableWriterRegistryTest,DefaultJdbcRowConverterTest,MySqlCatalogTest,MySqlJdbcDialectFactoryTest,JdbcWriterTypeBindingTest,BatchedStatementExecutorTest,JdbcSinkConfigTest,MySqlStmtCreatorFactoryTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
